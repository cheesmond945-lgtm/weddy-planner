<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WebPlan Nhà Cung Cấp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>/* Layout: deep-ink sidebar + porcelain workspace; champagne gold marks verified/primary actions. */
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface-2:#FAF8F5; --ink:#211E1B; --muted:#7B746B; --line:#E7E1D8; --line-strong:#D8D0C3;
  --gold:#9E7A43; --gold-strong:#86652F; --gold-soft:#F4EDE1; --gold-ink:#7A5B28;
  --side:#1C2421; --side-2:#26302C; --side-fg:#C9C3B6; --side-muted:#8B9188;
  --green:#3B7357; --green-soft:#E7F1EA; --blue:#3F6489; --blue-soft:#E8EEF5; --red:#A9473B; --red-soft:#F7E9E6;
  --scrim:rgba(20,22,20,.42); --shadow:0 1px 2px rgba(40,30,15,.04),0 6px 22px -12px rgba(40,30,15,.14);
  --font-display:'Cormorant Garamond','Lora',Georgia,serif; --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; --r-sm:7px; --side-w:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#191D1B; --surface-2:#1E2321; --ink:#ECE7DE; --muted:#9C968B; --line:#2B312E; --line-strong:#38403C;
  --gold:#C9A66B; --gold-strong:#D9B87E; --gold-soft:#2A261D; --gold-ink:#E2C48E;
  --side:#0E1110; --side-2:#1A1F1D; --side-fg:#C9C3B6; --side-muted:#7D847C;
  --green:#7DBE9A; --green-soft:#1B2A22; --blue:#8DB0D6; --blue-soft:#1A2430; --red:#E08E80; --red-soft:#2E1C19;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#191D1B; --surface-2:#1E2321; --ink:#ECE7DE; --muted:#9C968B; --line:#2B312E; --line-strong:#38403C;
  --gold:#C9A66B; --gold-strong:#D9B87E; --gold-soft:#2A261D; --gold-ink:#E2C48E;
  --side:#0E1110; --side-2:#1A1F1D; --side-fg:#C9C3B6; --side-muted:#7D847C;
  --green:#7DBE9A; --green-soft:#1B2A22; --blue:#8DB0D6; --blue-soft:#1A2430; --red:#E08E80; --red-soft:#2E1C19;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
input,select,textarea{outline:none}
.subtext{color:var(--muted);font-size:12.5px;line-height:1.55}
.block{display:block}.nowrap{white-space:nowrap}.right{text-align:right}.center{text-align:center}.strong{font-weight:600}.min0{min-width:0}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:18px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:18px}.my-3{margin-block:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.display-name{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2}

/* ---------- Shell ---------- */
.portal-sidebar{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.brand{display:block;padding:28px 26px 22px}
.wordmark{font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1;color:#F2ECE0;letter-spacing:-.01em}
.wordmark em{font-style:italic;font-weight:500;color:var(--gold-strong)}
:root .wordmark em{color:#D3B27A}
.dotmark{color:#D3B27A}
.brand p{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--side-muted);margin-top:10px}
.portal-nav{display:grid;gap:2px;padding:6px 14px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;font-size:13.5px;color:var(--side-fg);transition:background .15s,color .15s;position:relative}
.nav-item svg{width:18px;height:18px;stroke-width:1.6;color:var(--side-muted)}
.nav-item:hover{background:var(--side-2);color:#F2ECE0}
.nav-item.active{background:var(--side-2);color:#F2ECE0;font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#D3B27A}
.nav-item.active svg{color:#D3B27A}
.nav-count{margin-left:auto;font-size:11px;background:#D3B27A;color:#1C2421;border-radius:999px;padding:0 7px;font-weight:600;line-height:18px}
.sidebar-note{margin:auto 18px 14px;padding:14px;border:1px dashed rgba(211,178,122,.35);border-radius:9px}
.sidebar-note p{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#D3B27A;font-weight:600}
.sidebar-note span{font-size:12px;color:var(--side-muted);line-height:1.5;display:block;margin-top:4px}
.sidebar-account{display:flex;gap:11px;align-items:center;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.07)}
.sidebar-account strong{display:block;font-size:13px;color:#F2ECE0;font-weight:500}
.sidebar-account p{font-size:11.5px;color:var(--side-muted)}
.sidebar-account>svg{margin-left:auto;width:14px;color:var(--side-muted)}
.studio-logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:17px;color:var(--gold-ink);background:var(--gold-soft);border:1px solid var(--line-strong)}
.portal-sidebar .studio-logo{background:#2C3531;color:#D3B27A;border-color:#3A4440}
.studio-logo.large{width:52px;height:52px;font-size:22px}
.portal-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-left:var(--side-w);height:62px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumb svg{width:14px}.crumb strong{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.vr{width:1px;height:24px;background:var(--line)}
.header-notification{position:relative}.header-notification::after{content:"";position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.icon-btn.menu-btn,.icon-btn.back-btn{display:none}
.portal-main{margin-left:var(--side-w);padding-block:30px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1380px;margin:0 auto}
.sidebar-scrim{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .05s;background:transparent}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--gold);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 14px -8px var(--gold)}
.btn.primary:hover:not(:disabled){background:var(--gold-strong)}
:root[data-theme="dark"] .btn.primary{color:#191D1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#191D1B}}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.outline{background:var(--surface);border-color:var(--line-strong)}
.btn.outline:hover:not(:disabled){border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.link{height:auto;padding:6px 2px;color:var(--gold-ink)}
.btn.link:hover{text-decoration:underline}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.link.sm{height:auto;padding:6px 2px}
.btn.block{width:100%}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.sm{width:28px;height:28px}.icon-btn.sm svg{width:14px;height:14px}
.icon-btn.rot svg{transform:rotate(-90deg)}
.text-link{color:var(--gold-ink);font-size:13px;font-weight:500;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.text-link:hover{text-decoration:underline}
.inline-icon{display:inline-flex;align-items:center;gap:4px;margin-top:8px}.inline-icon svg{width:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;cursor:pointer}
.chip svg{width:14px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{font-size:11px;background:var(--gold);color:#fff;border-radius:999px;padding:0 6px}

/* ---------- Headings / badges ---------- */
.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.page-heading h1{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.lede{margin-top:8px;color:var(--muted);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.badge svg{width:12px;height:12px}
.badge.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.badge.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.badge.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.badge.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.demo-notice{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 16px;background:var(--green-soft);color:var(--green);border-radius:9px;margin-bottom:18px;font-size:13.5px}
.demo-notice svg{width:16px}.demo-notice span{flex:1}.demo-notice .icon-btn{color:var(--green)}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:26px}
.kpi-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;box-shadow:var(--shadow);min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi-label{font-size:12.5px;color:var(--muted)}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink)}.kpi-icon svg{width:17px}
.kpi-number{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.gold .kpi-number{color:var(--gold-ink)}.kpi.green .kpi-number{color:var(--green)}
.meter{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.meter.thin{height:4px}.kpi.green .meter i{background:var(--green)}
.paid-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin:-8px 0 18px}
.paid-bar>div:first-child{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.paid-bar strong{color:var(--ink)}
.paid-bar .meter i{background:var(--green)}

/* ---------- Data blocks ---------- */
.data-block,.todo-block,.profile-summary,.chat-frame,.profile-form,.creation-form,.form-summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.data-block{overflow:hidden;min-width:0}
.block-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px}
.block-heading h2{font-size:15px;font-weight:600}
.count{color:var(--muted);font-weight:400;font-size:13px;margin-left:4px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:13.5px}
.data-table th{padding:11px 16px;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-block:1px solid var(--line);white-space:nowrap}
.data-table td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table tbody tr{transition:background .12s}
.data-table tbody tr:hover{background:var(--surface-2)}
.data-table tr.row-selected{background:var(--gold-soft)}
.data-table tr:last-child td{border-bottom:0}
.data-table .amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.order-code{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.customer-name{font-weight:500;min-width:130px}
.row-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.table-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.pagination{display:flex;align-items:center;gap:6px}
.page-num{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.empty-result{padding:46px 20px;text-align:center;color:var(--muted)}
.empty-result h1{font-family:var(--font-display);font-size:64px;color:var(--ink)}
.service-cell{display:flex;gap:12px;align-items:center;min-width:240px}
.service-cell img,.service-image-empty{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0}
.service-image-empty{display:grid;place-items:center;background:var(--surface-2);border:1px dashed var(--line-strong);color:var(--muted)}.service-image-empty svg{width:18px}

/* menus */
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);z-index:25;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px -10px rgba(0,0,0,.25);padding:5px;display:grid}
.menu.end{right:0}
.menu button{text-align:left;padding:9px 11px;border:0;background:none;border-radius:6px;font-size:13px;cursor:pointer}
.menu button:hover:not(:disabled){background:var(--surface-2)}.menu button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Filters ---------- */
.filters{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search-control{flex:1 1 260px;display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;min-width:0}
.search-control:focus-within,.date-filter:focus-within{border-color:var(--gold)}
.search-control svg{width:16px;color:var(--muted)}
.search-control input{border:0;background:transparent;width:100%;min-width:0;font-size:13.5px}
.select-wrap{position:relative;display:inline-flex}
.select-wrap svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:15px;color:var(--muted);pointer-events:none}
.select-control{appearance:none;height:40px;padding:0 34px 0 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;cursor:pointer;min-width:150px}
.select-control.sm{height:30px;min-width:58px;padding:0 8px;font-size:12.5px;appearance:auto}
.select-control:focus{border-color:var(--gold)}
.date-filter{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;max-width:100%}
.date-filter svg{width:15px;color:var(--muted)}.df-label{color:var(--muted);white-space:nowrap}
.date-filter input{border:0;background:transparent;font-size:12.5px;width:118px;min-width:0}
.dash{color:var(--muted)}

/* ---------- Overview ---------- */
.overview-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.stack{display:grid;gap:18px}
.profile-summary{overflow:hidden}
.ps-cover{height:96px;overflow:hidden;position:relative}
.ps-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.ps-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--surface))}
.ps-body{padding:0 20px 20px;margin-top:-30px;position:relative}
.profile-identity{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px}
.profile-identity .studio-logo{background:var(--surface);box-shadow:0 0 0 4px var(--surface)}
.profile-identity strong{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.1;display:block}
.profile-identity p{font-size:12.5px;color:var(--muted)}
.permission-note{color:var(--muted);font-size:13px;margin:12px 0 16px}
.todo-block{padding:18px 20px 8px}
.todo-block h2{font-size:15px;font-weight:600;margin-bottom:6px}
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.todo-item:last-child{border:0}
.todo-item:hover span:nth-child(2){color:var(--gold-ink)}
.todo-count{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);font-weight:600;font-variant-numeric:tabular-nums}
.todo-item svg{margin-left:auto;width:15px;color:var(--muted)}

/* ---------- Side panels ---------- */
.with-panel-layout{display:block}
.with-panel-layout.has-panel{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:22px;align-items:start}
.side-panel{position:sticky;top:calc(62px + 18px + env(safe-area-inset-top,0px));max-height:calc(100vh - 62px - 36px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-scrim{display:none}
.panel-title{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.panel-title h2{font-size:15px;font-weight:600}
.panel-content{padding:20px}
.panel-hero{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.detail-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:16px 0 0}
.detail-fields .full{grid-column:1/-1}
.detail-fields dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.detail-fields dd{margin:0;font-size:13.5px}
.detail-note{margin:20px 0;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:8px}
.detail-note label{font-weight:500}
.input-control{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13.5px}
.input-control:focus{border-color:var(--gold)}
.input-control.ta{height:auto;padding:10px 12px;resize:vertical;line-height:1.6}
.panel-actions{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.phone-chip{display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;user-select:all;font-weight:500}.phone-chip svg{width:14px;color:var(--gold)}
.detail-sections h3{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.detail-sections p{font-size:13.5px;line-height:1.7}
.detail-card{padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:14.5px}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:12px}
.timeline li{position:relative;font-size:13px;display:grid}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--surface)}
.timeline li.pending::before{background:var(--gold)}
.timeline span{color:var(--muted);font-size:12px}
.bank-card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:6px}
.bank-card p{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.bank-card span{width:76px;color:var(--muted);font-size:12px;flex-shrink:0}
.bank-card code{font-family:ui-monospace,Menlo,monospace;font-size:12px;user-select:all}

/* ---------- Banners ---------- */
.field-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);border-radius:var(--r);margin-bottom:20px;font-size:13.5px;flex-wrap:wrap}
.field-banner>svg{width:18px;color:var(--gold-ink)}
.sector-banner>div:first-child{display:grid}
.sector-banner strong{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.2}
.status-tally{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.status-tally span{font-size:12px;color:var(--muted);display:grid;text-align:right}
.status-tally b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.finance-note{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;background:var(--gold-soft);border-radius:9px;margin-bottom:20px;font-size:13.5px}
.finance-note svg{width:17px;color:var(--gold-ink);margin-top:2px}
.profile-notice{align-items:flex-start}.profile-notice>svg{margin-top:2px}
.profile-notice p{color:var(--muted);margin-top:2px}
.account-examples{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.account-examples summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.account-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.account-card{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;transition:border-color .15s,background .15s}
.account-card:hover{border-color:var(--gold)}
.account-card.on{background:var(--gold-soft);border-color:var(--gold)}
.account-card strong{font-size:13.5px;font-weight:600}.account-card span{font-size:12px;color:var(--muted)}

/* ---------- Forms ---------- */
.breadcrumb{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px}
.breadcrumb a{color:var(--gold-ink)}
.creation-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.creation-form,.profile-form{padding:26px 28px 22px;min-width:0}
.form-section{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.form-section>h2{display:flex;align-items:center;font-size:17px;font-weight:600;margin-bottom:18px}
.section-number{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:12px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-ink);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.section-description{font-size:13px;color:var(--muted);margin:-10px 0 18px 40px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.form-grid .full,.form-field.full{grid-column:1/-1}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form-field{display:grid;gap:6px;min-width:0;align-content:start}
.field-label{font-size:13px;font-weight:500}
.form-field input,.form-field select,.form-field textarea,.editable-table input{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:9px 12px;font-size:13.5px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
.form-field input,.form-field select{height:40px}
.form-field textarea{resize:vertical}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus,.editable-table input:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.form-field input:disabled,.form-field select:disabled,.form-field textarea:disabled{background:var(--surface-2);color:var(--muted)}
.has-error input,.has-error select,.has-error textarea{border-color:var(--red)}
.field-error{color:var(--red);font-size:12.5px;line-height:1.5;margin-top:4px;display:block}
.form-subheading{font-size:14px;font-weight:600;margin:20px 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.form-subheading .subtext{font-weight:400}
.readonly-line{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-radius:8px}
.readonly-line strong{color:var(--ink);font-weight:500}
.customer-pick{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px}.customer-pick .form-field{flex:1}
.order-package{padding:18px;margin:14px 0;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.order-package .form-field input,.order-package .form-field select,.order-package .form-field textarea{background:var(--surface)}
.package-heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.package-heading strong{margin-right:auto;font-weight:600}
.pkg-index{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600}
.package-facts{margin:12px 0 4px;padding:12px 14px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;font-size:13px;display:grid;gap:4px;color:var(--muted)}
.package-facts b{color:var(--ink);font-weight:500}
.pf-price{color:var(--ink)}.pf-price strong{color:var(--gold-ink);margin-left:4px}.pf-price span{color:var(--muted);margin-left:6px}
.package-facts .text-link{justify-self:start;margin-top:4px}
.editable-table{font-size:13px}
.editable-table th{padding:10px 8px}
.editable-table td{padding:10px 8px}
.editable-table input{padding:7px 9px;height:36px;font-size:13px}
.editable-table td:first-child{min-width:170px}
.editable-table .w-qty{width:80px}.editable-table .w-rate{width:100px}
.editable-table input[type=date]{min-width:140px}
.editable-table input[type=number]{min-width:90px;font-variant-numeric:tabular-nums}
.suffix{display:flex;align-items:center;gap:4px}.suffix input{min-width:64px!important}
.quote-totals{margin:14px 0 0 auto;max-width:330px;display:grid;gap:10px}
.quote-totals>p,.summary-prices p{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.total-line{border-top:1px solid var(--line);padding-top:12px;font-size:16px!important;color:var(--gold-ink)}
.total-line strong{font-size:18px}
.plan-meter{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:13px}
.plan-meter.ok .meter i{background:var(--green)}.plan-meter.bad .meter i{background:var(--red)}
.plan-meter .meter{margin-top:8px}
.inline-note{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin-top:12px;align-items:flex-start}
.inline-note svg{width:15px;height:15px;margin-top:2px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.form-summary{position:sticky;top:calc(62px + 18px + env(safe-area-inset-top,0px));padding:22px;min-width:0}
.form-summary dl{margin:0}
.form-summary dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:14px}
.form-summary dd{margin:3px 0 0;font-size:14px}
.form-summary .display-name{font-size:22px}
.summary-prices{border-top:1px solid var(--line);margin-top:20px;padding-top:12px;display:grid;gap:8px;margin-bottom:12px}
/* file rows */
.file-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.file-ico{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex-shrink:0}.file-ico svg{width:17px}
.file-copy{flex:1;min-width:0}.file-copy strong{font-size:13.5px;font-weight:500}
.file-copy p{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.file-upload-button{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;background:var(--surface)}
.file-upload-button:hover{border-color:var(--gold)}
.file-upload-button svg{width:15px}
.file-upload-button input,.thumbnail-add input{position:absolute;width:1px;height:1px;opacity:0}
.file-upload-button.disabled{opacity:.5;cursor:not-allowed}
.file-preview{width:100%;max-height:65vh;object-fit:contain;border-radius:8px}
.line-editor{margin-top:6px}
.line-editor h3{font-size:13px;font-weight:500;margin-bottom:8px}
.line-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.line-bullet{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.checkbox-row{display:flex;gap:8px;flex-wrap:wrap}
.check-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;cursor:pointer}
.check-pill.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.check-pill input,.checkbox-label input,.field-option input{accent-color:var(--gold)}
.checkbox-label{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;cursor:pointer}
.checkbox-label input{margin-top:3px}
.segmented-control{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;flex-wrap:wrap}
.segmented-control button{height:34px;padding:0 14px;border:0;border-radius:7px;background:transparent;font-size:13px;cursor:pointer;color:var(--muted)}
.segmented-control button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.price-preview{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--gold-soft);display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--gold-ink);font-weight:600;font-size:16px;flex-wrap:wrap}
.price-preview span{font-size:12px;font-weight:500;color:var(--muted)}
.cover-upload{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cover-upload>img,.empty-cover{width:200px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px}
.empty-cover{border:1.5px dashed var(--line-strong);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px}
.empty-cover svg,.empty-preview svg{width:28px;height:28px;stroke-width:1.3;color:var(--gold)}
.cover-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:13.5px}
.inline-library{border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:16px;background:var(--surface-2)}
.inline-library h3{font-size:13px;font-weight:500;margin-bottom:8px}
.thumbnail-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.thumbnail-button,.thumbnail-add,.gallery-item{width:84px;height:68px;border-radius:8px;overflow:hidden;position:relative}
.thumbnail-button{border:1px solid var(--line);padding:0;cursor:pointer;background:none}
.thumbnail-button img,.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .icon-btn{position:absolute;top:3px;right:3px;background:var(--surface);opacity:.92}
.thumbnail-add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.thumbnail-add:hover{border-color:var(--gold);color:var(--gold-ink)}
.thumbnail-add svg{width:20px}
details.collapsible summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:17px;font-weight:600}
details.collapsible summary::-webkit-details-marker{display:none}
details.collapsible summary::after{content:"+";margin-left:auto;font-size:22px;font-weight:300;color:var(--muted)}
details.collapsible[open] summary{margin-bottom:16px}
details.collapsible[open] summary::after{content:"−"}
details.collapsible summary .subtext{font-weight:400}
.package-preview{padding:0;overflow:hidden}
.preview-eyebrow{padding:14px 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.package-preview>img,.empty-preview{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.empty-preview{background:var(--surface-2);border-block:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.preview-body{padding:18px 20px 20px}
.preview-body h2{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15;margin:6px 0 10px;overflow-wrap:anywhere;text-wrap:balance}
.preview-body>p{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.preview-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.preview-price{display:block;color:var(--gold-ink);margin:16px 0;font-size:19px;font-variant-numeric:tabular-nums}
.preview-note{border-top:1px solid var(--line);padding-top:12px;font-size:12.5px!important;display:flex;align-items:center;gap:8px}
.state-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}.state-dot.on{background:var(--green)}
/* profile */
.stepper{list-style:none;display:flex;gap:0;margin:0 0 18px;padding:0;counter-reset:s;overflow-x:auto}
.stepper li{flex:1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:10px 14px 10px 0;white-space:nowrap;position:relative}
.stepper li:not(:last-child)::after{content:"";flex:1;height:1px;background:var(--line-strong);min-width:20px}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:12px;font-weight:600;background:var(--surface);flex-shrink:0}
.stepper li.done{color:var(--ink)}.stepper li.done span{background:var(--gold);border-color:var(--gold);color:#fff}
.profile-logo-row{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.profile-logo-row>div:last-child{flex:1}
.profile-logo-row .file-row{border:0;padding-bottom:0}
.field-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.field-option{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line-strong);border-radius:9px;font-size:13.5px;cursor:pointer;min-height:54px;line-height:1.4;transition:border-color .15s,background .15s}
.field-option:hover{border-color:var(--gold)}
.field-option.selected{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:500}
.field-option.disabled{cursor:not-allowed;opacity:.7}
.sector-caption{padding:11px 14px;background:var(--surface-2);font-size:13px;border-radius:8px}
.verification-fieldset{border:0;margin:0;padding:0;min-width:0}
.verification-anchor{scroll-margin-top:90px}
.profile-sticky-actions{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 -28px -22px;padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}
.status-message{font-size:13px;color:var(--green);margin-right:auto;max-width:60%}

/* ---------- Chat ---------- */
.chat-frame{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 62px - 170px);min-height:560px;overflow:hidden}
.conversation-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.conversation-search{padding:16px 14px 10px}
.conversation-tabs{display:flex;gap:8px;padding:0 14px 14px;border-bottom:1px solid var(--line)}
.conv-scroll{overflow-y:auto;flex:1}
.conversation{display:flex;gap:12px;width:100%;text-align:left;padding:16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;position:relative}
.conversation:hover{background:var(--surface-2)}
.conversation.selected{background:var(--gold-soft)}
.conversation.selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.person-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-strong);font-size:12.5px;font-weight:600;color:var(--gold-ink);flex-shrink:0}
.conversation-copy{flex:1;min-width:0}
.conversation-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.conversation-top strong{font-weight:600}.conversation-top time{font-size:11.5px;color:var(--muted)}
.conversation-last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.unread{min-width:20px;height:20px;border-radius:999px;background:var(--gold);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.chat-header strong{font-size:14px}.push{margin-left:auto}
.back-btn{font-size:18px}
.chat-history{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px;background:var(--surface-2)}
.chat-date{text-align:center;font-size:11.5px;color:var(--muted)}
.chat-date span{background:var(--surface);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.message{max-width:72%;align-self:flex-start;display:grid}
.message.studio{align-self:flex-end;justify-items:end}
.message-bubble{padding:11px 15px;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.message.studio .message-bubble{background:var(--side);color:#EFE9DD;border-color:var(--side);border-radius:14px 14px 4px 14px}
.message time{font-size:11px;color:var(--muted);margin-top:4px}
.chat-image{width:250px;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-top:6px}
.chat-compose{padding:12px 18px 16px;border-top:1px solid var(--line)}
.quick-replies{display:flex;gap:8px;flex-wrap:wrap}
.attach-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;color:var(--muted)}.attach-chip svg{width:14px}
.compose-box{display:flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:10px;padding:5px 5px 5px 12px;margin-top:10px;background:var(--surface)}
.compose-box:focus-within{border-color:var(--gold)}
.compose-box input{flex:1;min-width:0;border:0;background:transparent;font-size:13.5px;padding:6px 0}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);border:1px solid var(--line)}
.modal.wide{width:min(760px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 6px 22px}
.modal-head h3{font-family:var(--font-display);font-size:24px;font-weight:600;overflow-wrap:anywhere}
.modal-body{padding:8px 22px 20px;font-size:14px;line-height:1.65}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .with-panel-layout.has-panel{display:block}

}

}

  .icon-btn.menu-btn{display:inline-grid;margin-left:-8px}
  .portal-header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .portal-main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .account-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chat-frame{grid-template-columns:minmax(0,1fr);height:calc(100vh - 62px - 150px)}
  .chat-frame .chat-main{display:none}
  .chat-frame.show-chat .conversation-list{display:none}
  .chat-frame.show-chat .chat-main{display:flex}
  .icon-btn.back-btn{display:inline-grid}
}
@media (max-width:640px){
  .hide-sm{display:none}
  .crumb>span,.crumb>svg{display:none}
  .page-heading{margin-bottom:20px}
  .page-heading h1{font-size:32px}
  .kpi-grid,.kpi-grid.three{grid-template-columns:minmax(0,1fr);gap:10px}
  .kpi{padding:16px}.kpi-number{font-size:23px}
  .form-grid,.two-col,.field-options,.account-links,.detail-fields{grid-template-columns:minmax(0,1fr)}
  .creation-form,.profile-form{padding:20px 16px 16px}
  .profile-sticky-actions{margin:0 -16px -16px;padding-inline:16px}
  .status-message{max-width:100%;flex-basis:100%}
  .section-description{margin-left:0}
  .filters>*{flex:1 1 100%}
  .select-wrap,.select-control{width:100%}
  .date-filter{flex-wrap:nowrap}.date-filter input{width:100%;flex:1}.df-label{display:none}
  .customer-pick{flex-direction:column;align-items:stretch}
  .status-tally{margin-left:0;width:100%;justify-content:space-between}
  .message{max-width:88%}
  .data-table td{white-space:nowrap}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-grid .kpi:first-child{grid-column:1/-1}.kpi-grid.three .kpi:first-child{grid-column:auto}.kpi-number{font-size:21px}
  .chat-history{padding:16px}
  .quote-totals{max-width:none}
  .form-actions .btn{flex:1}
  .heading-action{width:100%}.heading-action>.btn,.heading-action .select-wrap{width:100%}
}

/* ===================== v2 additions ===================== */
.grow{flex:1}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.sel{user-select:all}.i12{width:12px;height:12px;vertical-align:-1px}
.pos{color:var(--green)}.neg{color:var(--red)}.danger-text{color:var(--red)!important}

.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.btn.danger{background:var(--red);color:#fff}.btn.danger:hover{filter:brightness(.95)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
body.modal-open{overflow:hidden}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45);max-width:min(560px,calc(100% - 32px));animation:toastIn .2s ease}

/* sidebar extras */

.portal-sidebar .menu-wrap{display:block}
button.sidebar-account{width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.07);text-align:left;cursor:pointer;color:inherit;font:inherit}
button.sidebar-account:hover{background:rgba(255,255,255,.03)}
.menu.up{bottom:calc(100% + 4px);top:auto;left:14px;right:14px}
.menu button.danger{color:var(--red)}

/* modal sizes: fixed head/foot, scrolling body */
.modal{display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
.modal.sm{width:min(460px,100%)}.modal.md{width:min(640px,100%)}.modal.lg{width:min(860px,100%)}.modal.xl{width:min(980px,100%)}.modal.full{width:min(1240px,100%);height:92vh;max-height:92vh}
.modal-head{border-bottom:1px solid var(--line);padding:16px 14px 14px 24px;flex-shrink:0;align-items:flex-start}
.modal-head h3{font-size:26px;line-height:1.15}
.modal-head .subtext{margin-top:3px}
.modal-body{overflow-y:auto;padding:20px 24px 24px;flex:1;min-height:0}
.modal-foot{flex-shrink:0;align-items:center;background:var(--surface)}
.foot-error{margin-right:auto;display:flex;align-items:center;gap:6px;color:var(--red);font-size:13px;max-width:56%}.foot-error svg{width:15px}

/* notices & empty states */
.notice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:9px;margin-bottom:16px;font-size:13.5px;background:var(--green-soft);color:var(--green)}
.notice svg{width:16px;margin-top:2px}.notice .subtext{color:inherit;opacity:.85}
.notice.warn{background:var(--gold-soft);color:var(--gold-ink)}.notice.info{background:var(--blue-soft);color:var(--blue)}
.ndot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:6px;flex-shrink:0}

.empty-state strong{color:var(--ink);font-size:15px}.empty-state p{max-width:42ch;font-size:13px}
.es-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);margin-bottom:4px}.es-icon svg{width:21px}
.field-hint{font-size:12px;color:var(--muted)}.field-hint.warn{color:var(--gold-ink)}
.fs-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.fs-head h2{font-size:17px;font-weight:600}.fs-head .section-description{margin:4px 0 0}
.form-section>.fs-head+*{margin-top:0}
.person-avatar{text-transform:uppercase}

/* order modal sections */
.mf-section{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin-bottom:16px;background:var(--surface)}
.mf-section h4{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.hint-box{align-self:end;padding:9px 12px;background:var(--surface-2);border-radius:8px}

/* quote grid */
.q-grid{display:grid;grid-template-columns:36px minmax(160px,2.4fr) minmax(90px,1fr) minmax(80px,.8fr) minmax(130px,1.3fr) minmax(120px,1.2fr) 36px;gap:10px;align-items:start}
.q-head{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--line);font-weight:500}

.fee-tag{display:inline-block;font-size:11px;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:1px 8px;margin-top:4px;margin-left:6px}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.q-total{display:flex;align-items:baseline;gap:16px;margin-left:auto;padding:10px 0 2px}
.q-total span{font-size:13.5px;color:var(--muted)}

/* installments */
.insts{display:grid;gap:12px}

.inst .form-field input,.inst .money-input,.inst .suffix-input{background:var(--surface)}
.inst-main{display:grid;grid-template-columns:minmax(150px,1.5fr) 110px minmax(150px,1.3fr) minmax(140px,1.1fr) 36px;gap:12px;align-items:start}
.inst-sub{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
.inst-act{padding-top:26px}
.lock-chip{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.seg{display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}

.seg button:disabled{cursor:not-allowed}
.seg.sm button{height:28px;padding:0 10px;font-size:12px}
.alloc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.alloc p{display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
.alloc strong{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.alloc .ok strong{color:var(--green)}.alloc .warn strong{color:var(--red)}
.alloc .meter{grid-column:1/-1;margin-top:6px}
.meter i.full{background:var(--green)}.meter i.over{background:var(--red)}
.round-note{grid-column:1/-1;display:flex!important;align-items:center;gap:8px;flex-wrap:wrap;color:var(--gold-ink)!important;grid-template-columns:none}.round-note svg{width:14px}

/* chat */
.chat-frame{height:calc(100vh - 62px - 150px);min-height:600px}

.conv-order{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.conv-order .badge{height:20px;font-size:11px;padding:0 7px}
.chat-header{gap:12px}.chat-header .grow{min-width:0}
.interest{display:flex;align-items:center;gap:8px;padding:9px 20px;font-size:13px;background:var(--gold-soft);color:var(--gold-ink);border-bottom:1px solid var(--line)}.interest svg{width:15px}
.draft-strip{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 20px;font-size:13px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface-2) 10px 20px);flex-wrap:wrap}
.draft-strip svg{width:16px;color:var(--gold-ink)}.draft-strip span{flex:1;min-width:200px}
.order-card{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-align:left;transition:box-shadow .3s,border-color .3s}
.order-card.hl{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.order-card.old{opacity:.72;background:var(--surface-2)}
.order-card.old .oc-head{background:var(--surface-2)}
.oc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--gold-soft)}
.oc-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--gold-ink)}.oc-ico svg{width:16px}
.oc-head strong{font-size:14px}
.ver{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-ink)}
.oc-status{padding:10px 14px 0}
.oc-body{padding:8px 14px 4px}
.oc-item{font-weight:600;font-size:14px}
.oc-body dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}
.oc-body dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.oc-body dd{margin:1px 0 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.oc-flag{font-size:12.5px;color:var(--gold-ink);background:var(--gold-soft);padding:6px 10px;border-radius:7px;margin-bottom:6px}
.oc-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line);margin-top:6px}
.oc-actions .btn{flex:1 1 auto}
.order-card.adjust .oc-head{background:var(--blue-soft)}.order-card.adjust .oc-ico{color:var(--blue)}
.req-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.req-card:not(.active){border-left-color:var(--line-strong)}
.rq-head{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--red)}.rq-head svg{width:14px}
.req-card:not(.active) .rq-head{color:var(--muted)}
.rq-text{font-size:14px;line-height:1.6}
.req-card .oc-actions{padding:6px 0 0;border:0}
.event{align-self:center;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);max-width:94%;flex-wrap:wrap;justify-content:center;text-align:center}

.event.resent p{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--blue)}.event.resent p svg{width:14px}

/* detail modal */
.detail-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver-tabs{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}

.ver-tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.changes{background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}.changes strong{color:var(--blue)}.changes ul{margin:6px 0 0;padding-left:20px;display:grid;gap:2px}
.d-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 10px}

.kv-grid .full{grid-column:1/-1}.kv-grid dt{font-size:11.5px;color:var(--muted);margin-bottom:2px}.kv-grid dd{margin:0;font-size:14px}
.card-block{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.data-table.compact th{padding:9px 12px}.data-table.compact td{padding:10px 12px;font-size:13px}

.pay-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}

.fee-box{margin-top:12px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;display:grid;gap:6px}

/* order list */

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
