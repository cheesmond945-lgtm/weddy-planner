.row-actions .btn.sm{height:30px;padding:0 10px;font-size:12.5px}

/* package form */
.creation-form.single{max-width:980px}
.plain-fieldset{border:0;margin:0;padding:0;min-width:0}
.sticky-actions{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 -28px -22px;padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}
.tags-input{display:grid;gap:8px}
.tag-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;padding:5px 6px 5px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.tag-box:focus-within{border-color:var(--gold)}
.tag-box input{flex:1;min-width:140px;border:0!important;height:30px!important;padding:0 4px!important;background:transparent;box-shadow:none!important}
.chip-tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 11px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:500}
.chip-tag button{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}.chip-tag button:hover{background:rgba(0,0,0,.08)}.chip-tag svg{width:12px}
.tag-sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tag-sugg .chip{height:28px;font-size:12px;padding:0 10px}
.ai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ai-btn{background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold-ink)}
.ai-box{flex-basis:100%;margin-top:6px;padding:12px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft);font-size:14px;line-height:1.6;text-align:left}
.ai-label{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--gold-ink);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.ai-label svg{width:13px}
.ai-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* albums */
.album-create{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}.album-create .form-field{flex:1}
.album-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.album-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ac-cover{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:var(--surface-2);cursor:pointer;overflow:hidden}
.ac-cover img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.ac-cover:hover img{transform:scale(1.03)}
.ac-empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px}.ac-empty svg{width:28px;height:28px;color:var(--gold)}
.ac-count{position:absolute;right:8px;top:8px;background:rgba(20,20,20,.68);color:#fff;font-size:11.5px;padding:2px 9px;border-radius:999px}
.ac-body{padding:10px 12px 12px;display:grid;gap:8px}
.ac-name{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}.ac-name:hover{color:var(--gold-ink)}
.ac-tools{display:flex;gap:2px}
.file-upload-button.block{justify-content:center}
.up-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:12px}
.up-row.err{grid-template-columns:minmax(0,1fr) auto 28px;color:var(--red)}.up-row em{font-style:normal}
.up-row .meter{margin:0}
.album-empty{display:flex;gap:12px;align-items:center;padding:18px;border:1.5px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:13.5px}.album-empty svg{width:26px;height:26px;color:var(--gold);flex-shrink:0}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ag-item{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ag-img{display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;cursor:zoom-in;background:var(--surface-2)}
.ag-img img{width:100%;height:100%;object-fit:cover}
.ag-item figcaption{display:flex;justify-content:space-between;padding:4px}
.cover-chip{position:absolute;left:6px;top:6px;display:flex;gap:4px;align-items:center;background:var(--gold);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}.cover-chip svg{width:11px}
.lightbox{position:fixed;inset:0;z-index:400;background:rgba(10,10,10,.92);display:grid;place-items:center;padding:56px 16px 24px}
.lightbox img{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;border-radius:6px}
.lb-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:max(10px,env(safe-area-inset-top,0px)) 14px 10px 20px;color:#eee;font-size:14px}
.lb-count{margin-left:auto;font-variant-numeric:tabular-nums;color:#bbb}
.lb-close{color:#eee}.lb-close:hover{background:rgba(255,255,255,.1)!important;color:#fff!important}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.22)}.lb-nav.prev{left:max(14px,env(safe-area-inset-left,0px))}.lb-nav.next{right:max(14px,env(safe-area-inset-right,0px))}

/* customer preview */
.cp-modal .modal-body{background:var(--bg)}
.cp-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:13px;margin-bottom:16px}.cp-banner svg{width:16px}
.cp-search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.cp-search .search-control{max-width:480px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px}
.filter-chip button{border:0;background:rgba(255,255,255,.15);color:inherit;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;cursor:pointer}.filter-chip svg{width:13px}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cp-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cp-cover{display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;cursor:pointer;background:var(--surface-2)}.cp-cover img{width:100%;height:100%;object-fit:cover}
.cp-cbody{padding:12px 14px 14px;display:grid;gap:6px}
.cp-name{background:none;border:0;padding:0;text-align:left;font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.15;cursor:pointer;color:var(--ink)}
.cp-price{font-weight:600;color:var(--gold-ink);font-variant-numeric:tabular-nums}.cp-price.big{font-size:18px;margin-top:6px}
.pub-tags{display:flex;flex-wrap:wrap;gap:8px}
.pub-tag{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 1px 3px rgba(40,30,15,.08);font-size:13px;color:var(--ink);cursor:pointer;white-space:normal;text-align:left}
span.pub-tag{cursor:default}
button.pub-tag:hover{border-color:var(--gold);color:var(--gold-ink)}.pub-tag.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.cp-detail{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.cp-hero{border-radius:16px;overflow:hidden;aspect-ratio:21/8;background:var(--surface-2);max-height:380px}.cp-hero img{width:100%;height:100%;object-fit:cover}
.cp-info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.cp-title{font-family:var(--font-display);font-size:38px;font-weight:600;line-height:1.1;text-wrap:balance}
.cp-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px}
.cp-desc{font-size:15px;line-height:1.7;max-width:70ch}
.cp-cap{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}.cp-cap svg{width:16px;color:var(--gold)}
.album-cards.public .ac-body{padding:10px 12px}

/* profile */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.slot{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb>button:first-child{display:block;width:100%;height:100%;border:0;padding:0;cursor:zoom-in}.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-x{position:absolute;top:3px;right:3px;background:var(--surface)!important;opacity:.92}
.doc-open{display:grid;justify-items:center;gap:10px;padding:30px;text-align:center;color:var(--muted)}.doc-open svg{width:34px;height:34px;color:var(--gold)}
.hours{margin-top:18px;display:grid;gap:6px}
.hour-row{display:grid;grid-template-columns:90px auto 1fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.hour-row .field-error{grid-column:1/-1}
.hr-times{display:flex;gap:6px;align-items:center}
.hr-times input{height:34px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:0 8px;font-size:13px}

/* responsive v2 */
@media (max-width:900px){
  .q-grid.q-head{display:none}
  .q-grid.q-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 32px;grid-template-areas:"stt name name del" ". unit qty ." ". price amt .";row-gap:8px;padding:12px 0}
  .q-stt{grid-area:stt}.q-name{grid-area:name}.q-unit{grid-area:unit}.q-qty{grid-area:qty}.q-price{grid-area:price}.q-amt{grid-area:amt;align-self:center;padding-top:0}.q-del{grid-area:del}
  .inst-main{grid-template-columns:1fr 1fr}.inst-main .inst-act{position:absolute;right:8px;top:6px;padding:0}.inst{position:relative}
  .inst-sub{grid-template-columns:1fr}
  .kv-grid{grid-template-columns:1fr 1fr}.cmp-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .modal-scrim{padding:0;align-items:end}
  .modal,.modal.sm,.modal.md,.modal.lg,.modal.xl,.modal.full{width:100%;max-height:96vh;height:auto;border-radius:16px 16px 0 0}
  .modal.xl,.modal.full,.modal.lg{height:96vh}
  .modal-head{padding:14px 10px 12px 16px}.modal-head h3{font-size:22px}
  .modal-body{padding:14px 14px 20px}
  .modal-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .modal-foot .btn{flex:1 1 auto;padding:0 10px}
  .foot-error{max-width:100%;flex-basis:100%}
  .mf-section{padding:14px 12px;border-radius:10px}
  .alloc,.pay-sum{grid-template-columns:1fr}
  .oc-body dl{grid-template-columns:1fr 1fr}
  .message:has(.order-card),.message:has(.req-card){max-width:100%}
  .sticky-actions{margin:0 -16px -16px;padding-inline:16px}
  .sticky-actions .btn{flex:1}.sticky-actions>.subtext{flex-basis:100%}
  .album-create{flex-direction:column;align-items:stretch}
  .album-cards{grid-template-columns:1fr 1fr;gap:10px}
  .album-grid{grid-template-columns:1fr 1fr}
  .hour-row{grid-template-columns:1fr;gap:6px}
  .cp-title{font-size:30px}.cp-hero{aspect-ratio:4/3}
  .kv-grid{grid-template-columns:1fr}
  .chat-frame{height:calc(100vh - 62px - 130px);min-height:520px}
  .chat-header .btn span{display:none}
  .strip-item{flex-basis:120px}
  .btn-row{width:100%}.btn-row .btn{flex:1}
  .inst-main{grid-template-columns:1fr}
}
.chat-history{position:relative}
.row-actions.stack{flex-direction:column;align-items:flex-end;gap:6px}
.row-actions.wrap{flex-wrap:wrap;max-width:230px;margin-left:auto}
.data-table .tag-cell{max-width:180px}
.service-cell{min-width:220px}
@media (max-width:640px){.chat-header .btn-label{display:none}.chat-header .btn{width:40px;padding:0}.chat-header{padding:12px 14px}}
.cp-detail>.btn{justify-self:start}

/* ===================== v3: unified controls & layout fixes ===================== */
/* Standalone controls: one border, one focus ring */
.ctl,
.form-field input:not([type=checkbox]):not([type=radio]):not([type=file]),
.form-field select,
.form-field textarea,
.editable-table input{box-sizing:border-box;width:100%;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.4;box-shadow:none;outline:none;transition:border-color .15s,box-shadow .15s}
.form-field textarea,textarea.ctl{height:auto;padding:9px 12px;line-height:1.55;resize:vertical}
.ta2{min-height:62px}
.ctl:focus,.form-field input:not([type=checkbox]):not([type=radio]):focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent);outline:none}
.ctl.invalid,.has-error>input,.has-error>select,.has-error>textarea,textarea.invalid{border-color:var(--red)}
.ctl.invalid:focus,.has-error>input:focus,textarea.invalid:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.ctl:disabled,.form-field input:disabled,.form-field select:disabled,.form-field textarea:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}

/* Wrapped controls (icon / unit + input): the wrapper owns border and focus */
.ctl-wrap,.search-control,.date-filter,.tag-box,.compose-box{box-sizing:border-box;display:flex;align-items:center;min-width:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.ctl-wrap{height:40px;width:100%;overflow:hidden}
.ctl-wrap:focus-within,.search-control:focus-within,.date-filter:focus-within,.tag-box:focus-within,.compose-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.ctl-wrap.invalid{border-color:var(--red)}
.ctl-wrap.invalid:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.ctl-wrap.disabled,.ctl-wrap:has(input:disabled){background:var(--surface-2);color:var(--muted)}
.ctl-wrap input,.search-control input,.date-filter input,.tag-box input,.compose-box input,
.form-field .ctl-wrap input{flex:1 1 auto;min-width:0;width:100%;height:100%!important;margin:0;padding:0 12px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;font-size:13.5px;color:inherit}
.ctl-wrap input:disabled{cursor:not-allowed}
.ctl-wrap .unit{flex:0 0 auto;padding:0 12px 0 2px;color:var(--muted);font-size:13px;white-space:nowrap}
.ctl-wrap .lead{flex:0 0 auto;width:16px;height:16px;margin-left:12px;color:var(--muted)}
.ctl-wrap .lead+input{padding-left:8px!important}
.ctl-wrap.money input{text-align:right;font-variant-numeric:tabular-nums;padding-right:6px!important}
.ctl-wrap input[type=number]{-moz-appearance:textfield}
.ctl-wrap input[type=number]::-webkit-inner-spin-button{margin-right:-4px}
.ctl-wrap.sm{height:34px}
.search-control{height:40px;padding:0 4px 0 12px;gap:0}
.search-control>svg:first-child{width:16px;color:var(--muted);flex-shrink:0}
.search-control input{padding-left:8px!important}
.date-filter input{padding:0 6px!important;width:auto;flex:1 1 120px}
.compose-box{padding:4px 4px 4px 0}
.tag-box input{padding:0 6px!important;height:30px!important}

/* order modal: wide, flat sections */
.modal.xxl{width:min(1160px,calc(100vw - 48px))}
.order-modal .modal-body{padding:20px 24px 8px}
.order-modal .mf-section{border:0;border-radius:0;background:none;padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.order-modal .mf-section:last-child{border-bottom:0;margin-bottom:0}
.order-modal .mf-section h4{margin-bottom:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.order-modal .form-grid{gap:12px 16px}
.q-row{padding:6px 0}
.q-row .form-field input,.q-row .ctl-wrap{height:38px}
.q-stt,.q-amt{padding-top:9px}
.q-head{padding-bottom:6px}
.q-foot{margin-top:6px}
.q-total{padding:6px 0 0}
.quick-fill{margin-bottom:8px}

/* instalment table: one row per instalment */
.inst-table{width:100%;min-width:880px;border-collapse:collapse;table-layout:fixed}
.inst-table th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.inst-table td{padding:6px 8px 6px 0;vertical-align:top;border-bottom:1px dashed var(--line)}
.inst-table td.c{text-align:center;padding-top:8px}
.inst-table .ctl,.inst-table .ctl-wrap{height:38px}
.inst-table select.ctl{padding:0 8px}
.inst-table input[type=date].ctl{padding:0 8px}
.inst-table tr.locked td{background:color-mix(in srgb,var(--green-soft) 50%,transparent)}
.cell-error{display:block;color:var(--red);font-size:12px;line-height:1.35;margin-top:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.inst-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.round-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gold-ink)}.round-note svg{width:14px}
.insts>.field-error{margin-top:4px}

/* tooltip */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,4px);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:500;line-height:1.3;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;z-index:60;max-width:260px;white-space:normal;width:max-content}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
[data-tip]:disabled::after{display:none}

/* messages: search + one-line tabs */
.conversation-search{padding:14px 14px 10px}
.conversation-tabs{display:flex;flex-wrap:nowrap;gap:6px;padding:0 14px 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.conversation-tabs::-webkit-scrollbar{height:4px}
.conversation-tabs .chip{flex:0 0 auto;white-space:nowrap;height:34px;padding:0 12px;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;line-height:1}
.conversation-tabs .chip:hover{border-color:var(--line-strong);color:var(--ink)}
.conversation-tabs .chip.on{background:var(--gold-soft);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 45%,transparent);font-weight:600}
.conversation-tabs .chip span{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:600;line-height:1;border-radius:999px;background:var(--gold);color:#fff}

/* services */
.field-line{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.field-line .badge{height:22px}
.page-heading .lede .badge{vertical-align:middle}
.tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex-wrap:nowrap}
.tabs button{flex:0 0 auto}
.svc-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sf-search{flex:1 1 240px;min-width:200px}
.select-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13.5px;cursor:pointer;white-space:nowrap}
.select-btn svg{width:15px;color:var(--muted)}.select-btn.has{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.tf-pop{left:0;right:auto;min-width:260px;padding:10px;display:grid;gap:8px}
.tf-list{max-height:240px;overflow-y:auto;display:grid;gap:2px}
.tf-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}.tf-item:hover{background:var(--surface-2)}.tf-item input{accent-color:var(--gold)}
.price-range{display:flex;align-items:center;gap:6px;flex:0 1 auto}
.price-range .ctl-wrap{width:132px}
.price-range.invalid .ctl-wrap{border-color:var(--red)}
.pr-label{font-size:13px;color:var(--muted)}
.select-wrap.sort .select-control{min-width:160px}
.icon-btn.bordered{width:40px;height:40px;border:1px solid var(--line-strong);background:var(--surface)}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px}
.fchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px}
.fchip button{width:22px;height:22px;border:0;background:none;color:inherit;border-radius:50%;display:grid;place-items:center;cursor:pointer}.fchip button:hover{background:rgba(0,0,0,.08)}.fchip svg{width:12px}
.svc-table th:last-child{min-width:170px}
.tag-cell{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;max-width:none}
.more-tags{display:inline-grid;place-items:center;height:22px;min-width:28px;padding:0 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);cursor:default}
.icon-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
.icon-btn.act{width:34px;height:34px;border-radius:8px;color:var(--muted)}
.icon-btn.act svg{width:18px;height:18px}
.icon-btn.act:hover:not(:disabled){background:var(--gold-soft);color:var(--gold-ink)}
.icon-btn.danger-soft{color:color-mix(in srgb,var(--red) 75%,var(--muted))}
.icon-btn.danger-soft:hover:not(:disabled){background:var(--red-soft);color:var(--red)}

/* albums */
.album-create{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.album-create .btn{height:40px;flex-shrink:0}
.albums>.field-error{margin:-2px 0 8px}
.album-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:12px}
.album-card{border-radius:14px}
.ac-cover{aspect-ratio:4/3}
.ac-body{padding:12px 14px 14px;gap:10px}
.ac-name{font-size:15px}
.ac-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac-tools{display:flex;gap:2px}
.dropzone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:200px;border:2px dashed color-mix(in srgb,var(--gold) 55%,var(--line-strong));border-radius:16px;background:color-mix(in srgb,var(--gold-soft) 60%,var(--surface));cursor:pointer;text-align:center;padding:16px;transition:background .15s,border-color .15s}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:var(--gold-soft)}
.dropzone:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.dz-plus{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;margin-bottom:4px;box-shadow:0 8px 18px -8px var(--gold)}
.dz-plus svg{width:28px;height:28px;stroke-width:2.2}
.dropzone strong{font-size:16px}
.dropzone span:last-child{font-size:13px;color:var(--muted)}
.up-list{display:grid;gap:6px;margin-top:12px}
.up-row{grid-template-columns:minmax(0,1fr) 140px;font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.up-row.err{grid-template-columns:minmax(0,1fr) auto 28px;background:var(--red-soft)}
.album-modal .album-grid{margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ag-item.is-cover{outline:2px solid var(--gold);outline-offset:-2px}
.ag-item figcaption{gap:2px}
.album-empty{margin-top:12px}

/* profile: documents & hours */
.doc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;min-width:0}
.doc-row.has{background:var(--surface)}
.doc-row:not(.has){border-style:dashed}
.doc-row.invalid{border-color:var(--red)}
.file-ico{position:relative}
.file-ico.pdf{background:var(--red-soft);color:var(--red)}
.file-ico.img{background:var(--blue-soft);color:var(--blue)}
.file-ico em{position:absolute;bottom:-4px;right:-6px;font-style:normal;font-size:9px;font-weight:700;background:var(--red);color:#fff;border-radius:3px;padding:0 3px}
.fname{color:var(--ink);font-weight:500}
.doc-acts{display:flex;gap:4px;margin-left:auto;align-items:center;flex-shrink:0}
.hours{margin-top:18px;display:grid;gap:8px}
.hours-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:760px}
.hours-text{display:inline-flex;align-self:start;justify-self:start;padding:4px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:500}

@media (max-width:1200px){.sf-search{flex-basis:100%}}
@media (max-width:900px){.form-grid.three{grid-template-columns:1fr 1fr}.hours-row{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .form-grid.three{grid-template-columns:1fr}
  .modal.xxl{width:100%}
  .order-modal .modal-body{padding:14px 14px 8px}
  .price-range{flex:1 1 100%}.price-range .ctl-wrap{flex:1;width:auto}
  .tag-filter,.select-wrap.sort{flex:1}.select-btn{width:100%}
  .album-cards{grid-template-columns:1fr}
  .dropzone{height:170px}
  .album-modal .album-grid{grid-template-columns:1fr 1fr}
  .doc-row{flex-wrap:wrap}.doc-acts{margin-left:auto}
}
.ctl-wrap input[type=number]::-webkit-inner-spin-button,.ctl-wrap input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inst-table .ctl-wrap input[type=number]{text-align:right;padding-right:4px!important}
.svc-table td:nth-child(4){width:230px}
.tag-cell{max-width:230px;overflow:hidden}
.mini-tag{max-width:104px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:20px}
.tag-cell .mini-tag{flex:0 1 auto;min-width:0}
/* v4: album cards, combobox */
.album-card{transition:box-shadow .4s,border-color .4s}
.album-card.fresh{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.ac-cover .ac-empty{background:color-mix(in srgb,var(--gold-soft) 55%,var(--surface))}
.ac-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ac-head .ac-name{padding-top:5px}
.ac-add{display:flex;align-items:center;gap:10px}
.ac-add .file-upload-button{height:36px;padding:0 14px;font-size:13px;border-color:color-mix(in srgb,var(--gold) 45%,var(--line-strong));color:var(--gold-ink)}
.ac-add .file-upload-button:hover{background:var(--gold-soft)}
.inline-ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--green);margin:2px 0 6px}.inline-ok svg{width:14px}
.readonly-val{gap:0}.readonly-val .val{padding:0 12px 0 8px;font-size:13.5px;color:var(--ink)}
.combo{position:relative}
.combo-trigger{cursor:pointer}
.combo-trigger.open{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.combo-btn{flex:1;display:flex;align-items:center;height:100%;min-width:0;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font-size:13.5px;outline:none}
.combo-btn .val,.combo-btn .ph{padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-btn .ph{color:var(--muted)}
.combo-clear{margin-right:2px}
.combo-chev{width:16px;color:var(--muted);margin-right:12px;flex-shrink:0}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -14px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
.combo-list{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.combo-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;font-size:13.5px;cursor:pointer}
.combo-list li.act{background:var(--surface-2)}
.combo-list li.sel{color:var(--gold-ink);font-weight:600}
.combo-list li svg{width:15px;color:var(--gold)}
.combo-list mark{background:color-mix(in srgb,var(--gold) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
.combo-list .combo-empty{color:var(--muted);cursor:default;justify-content:center}
/* v5: instalment table fits the modal; rate editable */
.inst-table{min-width:0;width:100%}
.inst-table td:last-child,.inst-table th:last-child{padding-right:0}
.inst-table td.c{padding-top:9px;text-align:right}
.inst-table .ctl,.inst-table .ctl-wrap{height:40px;width:100%;min-width:0;box-sizing:border-box}
.inst-table input.ctl{text-overflow:ellipsis}
.ctl-wrap.rate input{text-align:right;padding-right:2px!important}
.insts .table-scroll{overflow-x:visible}
.inst-foot{margin-top:12px}
.order-modal .mf-section:last-child{padding-bottom:4px}
@media (max-width:900px){.insts .table-scroll{overflow-x:auto}.inst-table{min-width:820px}}
/* hidden tooltips must not widen scroll areas */
[data-tip]::after{display:none}
[data-tip]:hover::after,[data-tip]:focus-visible::after{display:block}
.inst-table [data-tip]::after,.icon-actions [data-tip]:last-child::after,.doc-acts [data-tip]:last-child::after{left:auto;right:0;transform:none}
.inst-table [data-tip]:hover::after,.icon-actions [data-tip]:last-child:hover::after,.doc-acts [data-tip]:last-child:hover::after{transform:none}

/* ===================== v6: luxury champagne gold + motion ===================== */
:root{
  --gold:#A9823A; --gold-strong:#8C6726; --gold-soft:#F6EEDD; --gold-ink:#7C5A1E;
  --gold-hi:#E9D39B; --gold-lo:#9A7230;
  --gold-grad:linear-gradient(135deg,#B88D3F 0%,#D9B86E 38%,#F0DDA6 52%,#C9A157 68%,#A57A31 100%);
  --gold-line:linear-gradient(90deg,transparent,#D8B66C 20%,#F2E2B0 50%,#D8B66C 80%,transparent);
  --bg:#F7F4EE; --line:#E8E0D2;
  --side:#15191A; --side-2:#1F2526;
  --ease:cubic-bezier(.22,.8,.24,1); --ease-spring:cubic-bezier(.34,1.4,.5,1);
  --shadow:0 1px 2px rgba(60,42,12,.05),0 10px 30px -16px rgba(60,42,12,.22);
  --shadow-lift:0 2px 4px rgba(60,42,12,.06),0 22px 44px -18px rgba(60,42,12,.32);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gold:#D4AF66; --gold-strong:#E6C680; --gold-soft:#2B2519; --gold-ink:#E8CB8C; --gold-hi:#F3DEA6; --gold-lo:#B28A44;
  --gold-grad:linear-gradient(135deg,#B8904A 0%,#DDBE78 38%,#F3E1AE 52%,#CFA75E 68%,#A9803A 100%);
  --bg:#101312; --side:#0B0D0D; --side-2:#171B1B}}
:root[data-theme="dark"]{
  --gold:#D4AF66; --gold-strong:#E6C680; --gold-soft:#2B2519; --gold-ink:#E8CB8C; --gold-hi:#F3DEA6; --gold-lo:#B28A44;
  --gold-grad:linear-gradient(135deg,#B8904A 0%,#DDBE78 38%,#F3E1AE 52%,#CFA75E 68%,#A9803A 100%);
  --bg:#101312; --side:#0B0D0D; --side-2:#171B1B}

body{background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed}

/* ---- metallic gold primary actions with a sheen on hover ---- */
.btn.primary{position:relative;overflow:hidden;background:var(--gold-grad);background-size:200% 100%;background-position:0% 50%;color:#2A1D07;border:1px solid color-mix(in srgb,var(--gold-lo) 70%,transparent);text-shadow:0 1px 0 rgba(255,240,200,.45);box-shadow:inset 0 1px 0 rgba(255,248,225,.6),0 8px 20px -10px color-mix(in srgb,var(--gold) 80%,transparent);transition:background-position .6s var(--ease),transform .2s var(--ease),box-shadow .3s var(--ease)}
.btn.primary::after{content:"";position:absolute;inset:-2px auto -2px -60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .7s var(--ease);pointer-events:none}
.btn.primary:hover:not(:disabled){background:var(--gold-grad);background-size:200% 100%;background-position:100% 50%;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,248,225,.7),0 14px 28px -12px color-mix(in srgb,var(--gold) 90%,transparent)}
.btn.primary:hover:not(:disabled)::after{left:120%}
.btn.primary:active:not(:disabled){transform:translateY(0) scale(.985)}
:root[data-theme="dark"] .btn.primary{color:#1E1505}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1E1505}}
.btn{transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),transform .2s var(--ease),box-shadow .25s var(--ease)}
.btn.outline:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(60,42,12,.35)}

/* ---- sidebar: gold hairline, gliding active state ---- */
.portal-sidebar{background:linear-gradient(180deg,#171C1D 0%,var(--side) 60%,#101414 100%);border-right:1px solid rgba(216,182,108,.14)}
.portal-sidebar::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(216,182,108,.5) 30%,rgba(216,182,108,.15) 70%,transparent)}
.wordmark em,.dotmark{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.brand p{letter-spacing:.24em}
.nav-item{transition:background .3s var(--ease),color .3s var(--ease),padding-left .3s var(--ease)}
.nav-item:hover{padding-left:16px}
.nav-item.active{background:linear-gradient(90deg,rgba(216,182,108,.16),rgba(216,182,108,.02))}
.nav-item.active::before{background:var(--gold-grad);width:3px;animation:barIn .45s var(--ease) both}
.nav-count{background:var(--gold-grad);color:#241906}
@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---- page & content entrance ---- */
.page-enter{animation:pageIn .55s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-heading h1{background:linear-gradient(180deg,var(--ink) 30%,color-mix(in srgb,var(--ink) 70%,var(--gold)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-heading{position:relative;padding-bottom:18px}
.page-heading::after{content:"";position:absolute;left:0;bottom:0;width:120px;height:1px;background:var(--gold-line);animation:lineIn .9s .15s var(--ease) both;transform-origin:left}
@keyframes lineIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.eyebrow{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.kpi,.strip-item,.album-card,.data-block,.profile-summary,.todo-block{animation:riseIn .6s var(--ease) both}
.kpi-grid>*:nth-child(2),.status-strip>*:nth-child(2),.album-cards>*:nth-child(2){animation-delay:.06s}
.kpi-grid>*:nth-child(3),.status-strip>*:nth-child(3),.album-cards>*:nth-child(3){animation-delay:.12s}
.kpi-grid>*:nth-child(4),.status-strip>*:nth-child(4),.album-cards>*:nth-child(4){animation-delay:.18s}
.status-strip>*:nth-child(5),.album-cards>*:nth-child(5){animation-delay:.24s}
.data-block{animation-delay:.1s}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.data-table tbody tr{animation:rowIn .45s var(--ease) both}
.data-table tbody tr:nth-child(2){animation-delay:.04s}.data-table tbody tr:nth-child(3){animation-delay:.08s}.data-table tbody tr:nth-child(4){animation-delay:.12s}.data-table tbody tr:nth-child(5){animation-delay:.16s}.data-table tbody tr:nth-child(6){animation-delay:.2s}.data-table tbody tr:nth-child(n+7){animation-delay:.24s}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.data-table tbody tr{transition:background .25s var(--ease)}
.data-table tbody tr:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--gold-soft) 80%,transparent),transparent)}

/* ---- cards: gold-edged, lift on hover ---- */
.kpi{position:relative;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold-line);opacity:.0;transition:opacity .35s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.kpi:hover::before{opacity:1}
.kpi-icon{background:var(--gold-grad);color:#2A1D07;box-shadow:inset 0 1px 0 rgba(255,250,230,.6)}
.kpi.gold .kpi-number{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.album-card,.cp-card,.strip-item,.doc-row,.order-card,.slot{transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.album-card:hover,.strip-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.ac-cover img{transition:transform .8s var(--ease)}
.album-card:hover .ac-cover img{transform:scale(1.06)}
.ac-count{backdrop-filter:blur(6px);background:rgba(20,16,8,.55)}
.order-card{border-color:color-mix(in srgb,var(--gold) 28%,var(--line-strong))}
.oc-head{background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--gold-soft) 40%,var(--surface)))}
.oc-ico{background:var(--gold-grad);color:#2A1D07}
.ver{border-color:var(--gold);background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}

/* ---- badges, tabs, chips ---- */
.badge.gold{background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--gold-hi) 35%,var(--gold-soft)));color:var(--gold-ink)}
.tabs button{position:relative;transition:color .25s var(--ease)}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--gold-grad);transform:scaleX(0);transition:transform .35s var(--ease)}
.tabs button.on{border-bottom-color:transparent}
.tabs button.on::after{transform:scaleX(1)}
.conversation-tabs .chip,.chip{transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.conversation-tabs .chip span,.chip span,.unread{background:var(--gold-grad);color:#241906}
.section-number{border-color:var(--gold);background:var(--gold-soft)}
.todo-count{background:var(--gold-grad);color:#241906}
.page-num{background:var(--gold-grad);color:#241906}

/* ---- inputs: warm focus glow ---- */
.ctl:focus,.form-field input:not([type=checkbox]):not([type=radio]):focus,.form-field select:focus,.form-field textarea:focus,.ctl-wrap:focus-within,.search-control:focus-within,.date-filter:focus-within,.tag-box:focus-within,.compose-box:focus-within,.combo-trigger.open{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent),0 6px 16px -10px color-mix(in srgb,var(--gold) 60%,transparent)}

/* ---- modals, menus, toasts ---- */
.modal-scrim{backdrop-filter:blur(4px);animation:fade .25s var(--ease)}
.modal{animation:modalIn .38s var(--ease-spring) both;border-color:color-mix(in srgb,var(--gold) 22%,var(--line))}
.modal-head{position:relative}
.modal-head::after{content:"";position:absolute;left:24px;right:24px;bottom:-1px;height:1px;background:var(--gold-line);opacity:.8}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media (max-width:640px){@keyframes modalIn{from{opacity:.4;transform:translateY(40px)}to{opacity:1;transform:none}}}
.menu,.combo-pop,.tf-pop{animation:popIn .22s var(--ease) both;transform-origin:top}
.menu.up{transform-origin:bottom}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.toast{background:linear-gradient(135deg,#1E1A12,#2A2416);color:#F3E6C4;border:1px solid rgba(216,182,108,.35);animation:toastIn .45s var(--ease-spring)}
.toast::before{content:"✦";color:#E3C57E;margin-right:8px}
.lightbox{animation:fade .25s var(--ease)}
.lightbox img{animation:modalIn .4s var(--ease) both}
.side-panel{animation:slideIn .4s var(--ease) both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ---- chat ---- */
.chat-history>*{animation:msgIn .4s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.message.mine .message-bubble{background:linear-gradient(135deg,#1F2526,#15191A);border-color:rgba(216,182,108,.25)}
.conversation{transition:background .25s var(--ease)}
.conversation.selected::before{background:var(--gold-grad)}
.order-card.hl{animation:glow 1.6s var(--ease) 2}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 10%,transparent),0 0 28px color-mix(in srgb,var(--gold) 45%,transparent)}}

/* ---- album & dropzone ---- */
.album-card.fresh{animation:riseIn .5s var(--ease) both,glow 1.6s var(--ease) .2s 1}
.dropzone{transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.dropzone:hover,.dropzone.drag{transform:scale(1.005)}
.dz-plus{background:var(--gold-grad);color:#2A1D07;transition:transform .45s var(--ease-spring)}
.dropzone:hover .dz-plus,.dropzone.drag .dz-plus{transform:rotate(90deg) scale(1.08)}
.cover-chip{background:var(--gold-grad);color:#2A1D07}
.ag-item{transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.ag-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.ag-img img{transition:transform .7s var(--ease)}.ag-item:hover .ag-img img{transform:scale(1.05)}
.meter i{background:var(--gold-grad)}
.stepper li.done span{background:var(--gold-grad);border-color:var(--gold);color:#2A1D07}
.icon-btn{transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.icon-btn.act:hover:not(:disabled){transform:translateY(-1px)}
.studio-logo{background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--gold-hi) 30%,var(--gold-soft)))}
.portal-sidebar .studio-logo{background:linear-gradient(135deg,#2B2A22,#1D1F1C);color:#E3C57E;border-color:rgba(216,182,108,.35)}
.profile-summary .ps-body:first-child{margin-top:0;padding-top:20px}
.overview-grid{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:1100px){.overview-grid{grid-template-columns:minmax(0,1fr)}}
/* v7: photo grid, row menu, recipient picker, toast action */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.photos.drag .photo-grid{outline:2px dashed var(--gold);outline-offset:6px;border-radius:12px}
.add-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;border:2px dashed color-mix(in srgb,var(--gold) 55%,var(--line-strong));border-radius:12px;background:color-mix(in srgb,var(--gold-soft) 55%,var(--surface));cursor:pointer;font-size:13px;font-weight:500;color:var(--gold-ink);transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.add-tile:hover{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-2px)}
.add-tile:hover .dz-plus{transform:rotate(90deg)}
.add-tile input,.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.add-tile:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.dz-plus.sm{width:42px;height:42px}.dz-plus.sm svg{width:22px;height:22px}
.photo-grid .ag-item{animation:riseIn .45s var(--ease) both}
.photo-grid .ag-img{aspect-ratio:4/3}
.icon-btn.more{width:34px;height:34px;border:1px solid transparent}
.icon-btn.more.on{background:var(--gold-soft);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.row-menu{position:fixed;z-index:500;width:210px;padding:6px;background:var(--surface);border:1px solid color-mix(in srgb,var(--gold) 22%,var(--line));border-radius:12px;box-shadow:0 22px 48px -16px rgba(40,28,8,.35);display:grid;gap:2px;animation:popIn .2s var(--ease) both;transform-origin:top right}
.row-menu.up{transform-origin:bottom right}
.row-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left;transition:background .2s var(--ease),color .2s var(--ease)}
.row-menu button svg{width:16px;height:16px;color:var(--muted)}
.row-menu button:hover,.row-menu button:focus-visible{background:var(--gold-soft);color:var(--gold-ink);outline:none}
.row-menu button:hover svg{color:var(--gold-ink)}
.row-menu button.danger,.row-menu button.danger svg{color:var(--red)}
.row-menu button.danger:hover{background:var(--red-soft)}
.rm-sep{height:1px;background:var(--line);margin:4px 6px}
.svc-table th:last-child{min-width:90px}
.recipient-chip{display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 4px 4px 10px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px}
.recipient-chip svg{width:14px;flex-shrink:0}.recipient-chip span{flex:1;min-width:0}
.cp-opt{display:grid;gap:1px}.cp-opt b{font-weight:600}.cp-opt em{font-style:normal;font-size:12px;color:var(--muted)}
.ctl-wrap.open{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.toast.has-action{display:flex;align-items:center;gap:14px;pointer-events:auto}
.toast-act{border:0;background:var(--gold-grad);color:#241906;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
/* v8: single photo card + gallery popup */
.photo-set{max-width:360px}
.ps-empty{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;max-width:360px;aspect-ratio:4/3;padding:18px;text-align:center;border:2px dashed color-mix(in srgb,var(--gold) 55%,var(--line-strong));border-radius:16px;background:color-mix(in srgb,var(--gold-soft) 60%,var(--surface));cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.ps-empty:hover,.ps-empty.drag{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-2px)}
.ps-empty:hover .dz-plus{transform:rotate(90deg) scale(1.06)}
.ps-empty strong{font-size:15px}.ps-empty span:last-child{font-size:12.5px;color:var(--muted)}
.ps-empty input,.gm-add input{position:absolute;width:1px;height:1px;opacity:0}
.ps-empty:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.ps-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);transition:box-shadow .35s var(--ease),transform .35s var(--ease),border-color .35s var(--ease)}
.ps-card:hover,.ps-card.drag{box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.ps-cover{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;cursor:zoom-in;background:var(--surface-2);overflow:hidden;border-radius:15px 15px 0 0}
.ps-cover img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.ps-cover:hover img{transform:scale(1.05)}
.ps-hover{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:13px;font-weight:500;color:#fff;background:linear-gradient(transparent,rgba(15,12,6,.65));opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.ps-hover svg{width:15px}.ps-cover:hover .ps-hover{opacity:1;transform:none}
.ps-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.ps-foot .file-upload-button{height:36px;border-color:color-mix(in srgb,var(--gold) 45%,var(--line-strong));color:var(--gold-ink)}
.ps-foot .file-upload-button:hover{background:var(--gold-soft)}
.photo-set .up-list{max-width:360px}
.gallery-modal .modal-body{padding-top:14px}
.gm-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gm-add{position:relative}
.thumb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:4px}
.tg-item{position:relative;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);transition:box-shadow .3s var(--ease),transform .3s var(--ease);animation:riseIn .4s var(--ease) both}
.tg-item:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.tg-item.is-cover{outline:2px solid var(--gold);outline-offset:-2px}
.tg-img{display:block;width:100%;height:160px;border:0;padding:6px;cursor:zoom-in;background:color-mix(in srgb,var(--surface-2) 80%,var(--line))}
.tg-img img{width:100%;height:100%;object-fit:contain}
.tg-item figcaption{display:flex;justify-content:space-between;padding:4px;border-top:1px solid var(--line)}
@media (max-width:1000px){.thumb-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.thumb-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tg-img{height:130px}.photo-set{max-width:none}}
.pick-hint{display:flex;align-items:center;gap:8px;margin:12px 14px 0;padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:500;animation:riseIn .4s var(--ease) both}
.pick-hint svg{width:15px}
.oc-req{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:var(--red-soft);border-left:3px solid var(--red);font-size:13.5px;line-height:1.55}
.oc-req .rq-head{margin-bottom:4px}
.ver.adj{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.oc-actions .menu-wrap{flex:0 0 auto}
.oc-actions .menu-wrap .icon-btn{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:8px}
.oc-actions .menu{bottom:auto}

/* ===== v9: service detail page ===== */
.breadcrumb{align-items:center}.breadcrumb svg{width:14px;height:14px;color:var(--muted-2,var(--muted))}
.breadcrumb [aria-current]{color:var(--ink);font-weight:500;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-heading h1{overflow-wrap:anywhere}
.dh-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.dh-id{font-family:var(--mono,ui-monospace,monospace);font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.detail-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px;margin:0}
.detail-kv .full{grid-column:1/-1}.detail-kv dt{font-size:12.5px;color:var(--muted);margin-bottom:4px}.detail-kv dd{margin:0;line-height:1.6}.detail-kv dd.strong{font-weight:600}
.page-actions{justify-content:flex-end}
.data-table tr.row-link{cursor:pointer}
.data-table tr.row-link:hover td{background:color-mix(in srgb,var(--gold-soft) 45%,transparent)}
.leave-modal .modal-foot{flex-wrap:wrap}
@media (max-width:640px){.detail-kv{grid-template-columns:1fr 1fr}}

/* ===== v9: tall photo card with collage ===== */
.photo-set{max-width:410px}
.photo-set .up-list{max-width:410px}
.ps-empty{max-width:410px;aspect-ratio:410/350}
.ps-card{width:100%;max-width:410px;border-radius:18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(30,22,8,.05),0 8px 24px -12px rgba(30,22,8,.18)}
.pc-cover{position:relative;display:block;width:100%;aspect-ratio:410/290;border:0;padding:0;margin:0;cursor:zoom-in;background:var(--surface-2);overflow:hidden;border-radius:17px 17px 0 0}
.ps-card.ro .pc-cover{border-radius:17px}
.pc-collage{position:absolute;inset:0;display:grid;gap:4px}
.pc-collage.n1{grid-template:1fr/1fr}
.pc-collage.n2{grid-template:1fr/1fr 1fr}
.pc-collage.n3{grid-template-columns:1.55fr 1fr;grid-template-rows:1fr 1fr}
.pc-collage.n4{grid-template-columns:1.75fr 1fr;grid-template-rows:repeat(3,1fr)}
.pc-collage.n3 .c0{grid-row:1/3}.pc-collage.n4 .c0{grid-row:1/4}
.pc-cell{position:relative;overflow:hidden;min-width:0;min-height:0;background:var(--surface-2)}
.pc-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.pc-cover:hover .pc-cell img{transform:scale(1.04)}
.pc-cover::after{content:none}
.pc-cover .ac-count{top:12px;right:12px;font-size:12.5px;font-weight:600;padding:4px 11px;z-index:2}
.pc-cover .ps-hover{z-index:2}.pc-cover:hover .ps-hover{opacity:1;transform:none}
.pc-cover:focus-visible{outline:none;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent)}
.ps-foot{min-height:60px;padding:10px 16px;background:color-mix(in srgb,var(--gold-soft) 35%,var(--surface));border-top:1px solid var(--line)}
.ps-foot .file-upload-button{position:relative}
.ps-foot .file-upload-button input{position:absolute;width:1px;height:1px;opacity:0}
@media (max-width:640px){.photo-set,.ps-card,.ps-empty{max-width:none}}
