<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebPlan – Prototype phía khách hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#29231D; --muted:#948A7C; --line:#EADFD0;
  --accent:#C49A4A; --accent-ink:#FFFFFF; --accent-soft:#F5EBD8;
  --sage:#3F8A63; --sage-soft:#E8F5EC; --gold:#AE8131; --warn:#B94A42; --warn-soft:#FBE9E6;
  --c1:#B5546F; --c2:#4F8A72; --c3:#C08A3E; --c4:#4F7FA8; --c5:#7A62A8; --c6:#B8664A;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A1B; --surface:#1D2627; --ink:#ECF0EE; --muted:#9AA8A6; --line:#2E3B3B;
    --accent:#D58AA8; --accent-ink:#1C1416; --accent-soft:#3A2430;
    --sage:#7FB59E; --sage-soft:#1F3029; --gold:#D4A94F; --warn:#E8826C; --warn-soft:#3A221D;
    --c1:#D77C95; --c2:#7FB59E; --c3:#D9AA63; --c4:#7FAAD0; --c5:#A590CE; --c6:#DE9276;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1B; --surface:#1D2627; --ink:#ECF0EE; --muted:#9AA8A6; --line:#2E3B3B;
  --accent:#D58AA8; --accent-ink:#1C1416; --accent-soft:#3A2430;
  --sage:#7FB59E; --sage-soft:#1F3029; --gold:#D4A94F; --warn:#E8826C; --warn-soft:#3A221D;
  --c1:#D77C95; --c2:#7FB59E; --c3:#D9AA63; --c4:#7FAAD0; --c5:#A590CE; --c6:#DE9276;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans)}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header — Weddy luxury pill navigation */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,247,242,.94);padding:12px 18px 8px;border:0;backdrop-filter:blur(12px)}
.top-in{max-width:1480px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px;flex-wrap:nowrap;background:var(--surface);border:1px solid rgba(234,223,208,.8);border-radius:28px;box-shadow:0 8px 24px rgba(68,48,22,.08)}
.brand{font:600 23px/1 var(--serif);letter-spacing:-.02em;color:var(--gold);background:none;border:0;padding:8px 0;cursor:pointer;white-space:nowrap}
.brand:after{content:" ®";font:500 10px var(--sans);vertical-align:top}
.nav{display:flex;gap:5px;flex:1;overflow-x:auto;min-width:0;justify-content:center;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:1px solid transparent;border-radius:999px;padding:10px 14px;font:500 13px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.nav button:hover,.nav button:focus-visible{color:var(--gold);background:#F8F0E2;border-color:#EAD9B8}
.nav button[aria-current="page"]{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 3px 9px rgba(174,129,49,.22)}
.cnt{background:var(--surface);color:var(--gold);border-radius:99px;font:600 10px/1 var(--sans);padding:3px 6px}
.nav button[aria-current="page"] .cnt{background:#fff;color:var(--gold)}
.auth{display:flex;gap:8px;align-items:center;flex:none}
.auth .btn{border-radius:999px}
.auth .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.who{font:500 13px var(--sans);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.top{padding:8px}.top-in{flex-wrap:wrap;gap:8px 12px;padding:10px 14px;border-radius:22px}.nav{order:3;flex-basis:100%;justify-content:flex-start}.brand{font-size:21px}.auth{margin-left:auto}}
@media (max-width:560px){.top-in{gap:6px}.nav button{padding:8px 11px;font-size:12px}.auth .btn{padding:6px 9px}.brand{font-size:19px}}

.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 70px}
.intro{margin-bottom:22px;max-width:680px}
.intro h1{font:600 clamp(28px,4.6vw,42px)/1.12 var(--serif);letter-spacing:-.02em}
.lede{color:var(--muted);margin-top:10px;max-width:60ch}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font:600 clamp(24px,3.6vw,34px)/1.15 var(--serif);letter-spacing:-.015em}

/* buttons, chips */
.btn{font:500 14px var(--sans);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.ai:hover{border-color:var(--accent)}
.btn.sage{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.icon{padding:0;width:34px;min-height:34px}
.btn.on{color:var(--accent);border-color:var(--accent)}
.btn.on svg{fill:currentColor}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent);font:500 14px var(--sans);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font:500 13px var(--sans);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sans);padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.badge.talk{background:var(--accent-soft);color:var(--accent)}
.badge.done{background:var(--sage-soft);color:var(--sage)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.tag{font:500 12px var(--sans);color:var(--cc,var(--muted))}
.fcode{display:none}
body.codes .fcode{display:inline-block;font:600 10px/1.5 var(--sans);background:var(--ink);color:var(--bg);padding:0 6px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:.02em}

/* cards, grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:22px}
.narrow{max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.svc{display:flex;flex-direction:column;overflow:hidden}
.svc .img{height:120px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--cc)}
.svc .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.svc h3{font:600 17px/1.3 var(--serif)}
.svc .acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.svc .acts .primary{flex:1}
.price b{font:600 16px var(--sans)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}
.rate svg{fill:var(--gold);stroke:var(--gold)}
.rate b{color:var(--ink);font-weight:600}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;max-width:680px;margin-bottom:14px}
.searchbar input{border:0;background:none;flex:1;font:inherit;color:var(--ink);padding:10px 0;min-width:0}
.searchbar input:focus{outline:none}
.searchbar:focus-within{border-color:var(--accent)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select{width:auto;min-width:160px}
.count{color:var(--muted);font-size:13px;margin-bottom:14px}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field label,.lbl{display:block;font:500 13px var(--sans);margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
input[type=checkbox],input[type=radio]{width:auto;padding:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{display:flex;flex-wrap:wrap;gap:8px 18px}
.choice label{font:400 14px var(--sans);display:inline-flex;gap:7px;align-items:center;margin:0;cursor:pointer}
/* Wedding setup: pill chips and gold selected service pills, based on reference */
.select-section{padding:22px 26px;border:1px solid #EADCC9;border-radius:22px;background:#FDFBF8;min-width:0}
.select-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.select-head .lbl{font-size:17px;font-weight:600;margin:0 0 3px}
.select-head .sub{font-size:14px;color:var(--muted)}
.select-status{display:inline-flex;align-items:center;gap:8px;flex:none;color:#B1832F;background:#F4EDE1;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.selectable-grid{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:0}
.select-option{position:relative;display:inline-flex!important;align-items:center;justify-content:center;gap:8px!important;min-height:48px;padding:11px 20px!important;border:1px solid #EADCC9;border-radius:999px;background:#fff;font:500 14px/1.3 var(--sans)!important;color:var(--ink);cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s;white-space:nowrap}
.select-option:hover{border-color:var(--gold);background:#FBF5EA}
.select-option input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.select-option:has(input:checked){border-color:#B18432;background:#B18432;color:#fff;box-shadow:0 5px 12px rgba(145,104,34,.20)}
.select-option:has(input:checked)::before{content:'✓';font-size:15px;font-weight:700;line-height:1}
.select-section .hint{margin-top:17px;font-size:14px;color:#9A8F80}
.select-tools{display:flex;align-items:center;gap:14px;flex:none}
.select-tools .linkbtn{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
@media(max-width:560px){.select-section{padding:16px;border-radius:16px}.select-head{gap:8px;flex-wrap:wrap}.select-option{min-height:42px;padding:9px 14px!important;font-size:13px!important;white-space:normal}.select-tools{gap:8px}}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--warn);font-size:13px;min-height:0}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
@media (max-width:560px){.two{grid-template-columns:1fr}}

/* modal, toast */
.mb{position:fixed;inset:0;background:rgba(10,18,19,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.mb.on{display:flex}
.md{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:24px}
.md.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.mh h2{font:600 22px/1.25 var(--serif)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:calc(100% - 32px)}

/* detail */
.back{margin-bottom:18px}
.dgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:start}
.dimg{height:320px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--cc)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.thumbs div{height:76px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 9%,var(--surface));color:var(--cc);opacity:.85}
.dinfo h1{font:600 clamp(26px,3.4vw,34px)/1.15 var(--serif);margin:6px 0 10px;letter-spacing:-.015em}
.bigprice{font:600 28px var(--sans);margin:18px 0 2px}
.hl{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hl li{display:flex;gap:8px;align-items:center}
.hl svg{color:var(--sage);flex:none}
.pkg{display:flex;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.pkgs{display:grid;gap:10px;margin:14px 0}
.dacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}}

/* favorites & compare */
.group{margin-bottom:30px}
.group h2{font:600 20px var(--serif);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cmpbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:22px;border-color:var(--accent);background:var(--accent-soft)}
.pick{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.best{display:inline-block;margin-top:4px}
.cmp th:first-child,.cmp td:first-child{color:var(--muted);font-weight:500;width:150px}
.empty{padding:40px 24px;text-align:center}
.empty h3{font:600 20px var(--serif);margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:16px}

/* timeline */
.tlhero{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:24px 28px;margin-bottom:22px}
.days{font:600 clamp(48px,7vw,72px)/1 var(--serif);letter-spacing:-.03em}
.days small{display:block;font:500 14px var(--sans);color:var(--muted);letter-spacing:0;margin-top:6px}
.facts{display:grid;gap:4px}
.facts b{font-weight:600}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--sage)}
.bar i.over{background:var(--warn)}
.tlactions{display:flex;flex-direction:column;gap:8px}
@media (max-width:860px){.tlhero{grid-template-columns:1fr}.tlactions{flex-direction:row;flex-wrap:wrap}}
.rows{overflow:hidden}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.done .rt{color:var(--muted);text-decoration:line-through}
.row.lock{background:color-mix(in srgb,var(--line) 35%,var(--surface))}
.rk{width:20px;height:20px;flex:none;margin-top:1px;color:var(--muted)}
.rk.st{border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.rk.st.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.chk{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--sage)}
.rb{flex:1;min-width:0}
.rt{font-weight:500}
.racts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.due{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.due.soon{color:var(--gold);font-weight:600}
.due.over{color:var(--warn);font-weight:600}
.rowend{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* plan */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);margin-bottom:22px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:7px;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.slot{margin-bottom:26px}
.slot h2{font:600 18px var(--serif);display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--ink)}
.slot h2 svg{color:var(--cc)}
.prow{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.prow .pm{flex:1;min-width:200px}
.prow .pm b{font:600 16px var(--serif)}
.ordline{display:flex;gap:4px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.prow .pm .ordline b{font:600 13px var(--sans);color:var(--ink)}
.wedcard{margin-bottom:16px}
.wc-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.wc-h b{font:600 17px var(--serif)}
.wc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px}.wc-g>div{display:flex;flex-direction:column;gap:2px;font-size:14px}.wc-g>div>span{font-size:12px;color:var(--muted)}.wc-g>div.wide{grid-column:1/-1}.wc-g small{color:var(--muted);font-weight:400}
.ordline .rv{flex-basis:100%;color:var(--ink);background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-radius:8px;padding:6px 10px}
.pa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dashed{border-style:dashed;background:transparent}
.banner{padding:12px 16px;border-radius:10px;background:var(--warn-soft);color:var(--warn);margin-bottom:18px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .sub{margin-bottom:4px}
.stat b{font:600 22px var(--sans);font-variant-numeric:tabular-nums}
.allocsum{display:flex;gap:20px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line);align-items:center;justify-content:space-between}
.tbl-wrap input.money{max-width:190px;text-align:right}

/* chat — split inbox and active conversation, based on reference */
body.chat-page .wrap{max-width:none;padding:14px 28px 28px}
body.chat-page .foot{display:none}
.chat{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 142px);min-height:610px;max-height:900px;overflow:hidden;border-radius:26px;background:var(--surface);box-shadow:0 8px 26px rgba(68,48,22,.06)}
.clist{border-right:1px solid var(--line);overflow:auto;padding:16px 12px}
.inbox-tools{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.inbox-search{min-width:0;flex:1;border:0!important;border-radius:999px!important;background:#F5F0EB!important;padding:12px 14px!important}
.inbox-filter{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.inbox-summary{display:flex;justify-content:space-between;gap:8px;padding:0 8px 12px;color:var(--muted);font-size:12px}
.citem{padding:13px 10px;margin:0 0 5px;border:0;border-radius:18px;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:3px;background:none;text-align:left;color:var(--ink);width:100%;align-items:center}
.citem[aria-current="true"]{background:#F7F1E7;box-shadow:inset 4px 0 var(--accent)}
.cavatar{grid-row:1/3;width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--accent-soft)}
.citem b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.citem .c-time{font-size:11px;color:var(--muted);white-space:nowrap}
.citem .c-preview{grid-column:2/4;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0}

.dsec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}
.dsec h2{font:600 24px var(--serif)}
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.album{padding:0;text-align:left;cursor:pointer;overflow:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.album .mos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(2,70px);gap:3px}
.album .mos>div{overflow:hidden;background:var(--line)}.album .mos>div:first-child{grid-row:1/3}
.album .mos img{width:100%;height:100%;object-fit:cover;display:block}
.album .ab{padding:14px 16px 16px}.album b{font:600 15px var(--serif);display:block}.album small{color:var(--muted);font-size:12px}
.dside{position:sticky;top:98px;padding:24px;border-radius:24px}
.dside .dpl{text-align:center;color:var(--muted);font-size:13px}
.dside .dpr{text-align:center;font:600 26px/1.25 var(--sans);color:var(--gold);margin:6px 0 4px}
.dside .dpr span{display:block;font-size:14px;color:var(--muted);font-weight:500;line-height:1.2}
.dside .dnote{text-align:center;margin-bottom:16px}
.drow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bg);margin-bottom:10px}
.drow svg{color:var(--muted);flex:none;margin-top:2px}.drow small{display:block;color:var(--muted);font-size:12px}.drow b{font-weight:600;font-size:14px}
.dbtns{display:grid;gap:10px;margin:16px 0 12px}
.dbtn{width:100%;min-height:48px;border-radius:14px;font-weight:600}
.dtip{font-size:12.5px;line-height:1.55;color:#8A5A12;background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.rsum{display:flex;align-items:center;gap:14px;margin-bottom:12px}.rsum b{font:600 40px/1 var(--serif)}
.rempty{border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);margin-top:16px}
.gall{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.gall>div{height:170px;border-radius:12px;overflow:hidden;background:var(--line)}
@media(max-width:900px){.dlay{grid-template-columns:1fr}.dside{order:-1;position:static}.albums{grid-template-columns:1fr}}
@media(max-width:700px){.dgal{grid-template-columns:1fr 1fr;grid-template-rows:1.6fr 1fr 1fr;height:420px}.gt:first-child{grid-column:1/3;grid-row:1}.dcard{padding:20px}.dicon{width:40px;height:40px}}

/* Scroll-down reveal: nội dung xuất hiện nhẹ nhàng khi người dùng cuộn trang */
.scroll-reveal{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}
.scroll-reveal.is-visible{opacity:1;transform:translateY(0);will-change:auto}
@media(prefers-reduced-motion:reduce){.scroll-reveal{opacity:1;transform:none;transition:none;will-change:auto}}

/* Floating quick actions: favorites + messages, replacing the header message tab */
.quick-actions{position:fixed;right:18px;bottom:22px;z-index:45;display:flex;flex-direction:column;gap:10px;align-items:center}
.quick-action{position:relative;width:46px;height:46px;border:1px solid #F0E2D5;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(65,45,20,.18);cursor:pointer;transition:transform .18s,box-shadow .18s}
.quick-action:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(65,45,20,.22)}
.quick-action svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quick-fav{color:#F05A83}.quick-chat{background:#C49A4A;color:#fff;border-color:#C49A4A}
.quick-count{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#E34F5F;color:white;font:600 10px/17px var(--sans);text-align:center;border:1px solid white}
@media(max-width:560px){.quick-actions{right:12px;bottom:14px;gap:8px}.quick-action{width:42px;height:42px}}

 const a=S.accounts.find(x=>x.id===id);
 S.user=a?a:{name:'Nguyễn Minh Anh',id,email:id.includes('@')?id:'',phone:id.includes('@')?'':id};

function doRegister(){

 if(!n){e.textContent='Vui lòng nhập họ và tên.';return}

 if(p1!==p2){e.textContent='Mật khẩu nhập lại chưa khớp.';return}
 const u={name:n,id,email:id.includes('@')?id:'',phone:id.includes('@')?'':id};

/* Đề xuất: điểm tổng hợp từ điểm Google Maps (hiệu chỉnh theo số đánh giá), giá và độ phù hợp với thông tin đám cưới */
function recommendCompare(L){
 const w=S.wedding,minP=Math.min(...L.map(s=>s.p)),maxR=Math.max(...L.map(s=>s.r)),maxRv=Math.max(...L.map(s=>s.rv));
 const catBud=w&&w.budget?w.budget*CAT(L[0].cat).share:0;
 const info=L.map(s=>{
  const bayes=(s.r*s.rv+4.3*100)/(s.rv+100),R=bayes/5,P=minP/s.p;
  const inBud=catBud?Math.min(1,catBud/s.p):null;
  const ov=w&&w.styles.length?s.st.filter(x=>w.styles.includes(x)).length/w.styles.length:null;
  const locOk=w&&w.loc?(s.loc===w.loc?1:0):null;
  const parts=[inBud,ov,locOk].filter(x=>x!==null);
  const F=parts.length?parts.reduce((a,x)=>a+x,0)/parts.length:null;
  const capOk=w&&w.cap&&s.cap?s.cap>=w.cap:null;
  let score=F===null?.55*R+.45*P:.4*R+.3*P+.3*F;
  if(capOk===false)score*=.7;
  return {s,score,inBud,ov,capOk,fit:inBud!==null&&inBud>=1};
 }).sort((x,y)=>y.score-x.score);
 if(info[0].score-info[1].score<.03)return {tie:true};
 const top=info[0],others=info.slice(1),s=top.s,rs=[];
 if(top.capOk===true&&others.some(o=>o.capOk===false))rs.push('đủ chỗ cho '+w.cap+' khách');
 if(top.fit&&others.some(o=>!o.fit))rs.push('nằm trong ngân sách hạng mục');
 if(top.ov&&others.every(o=>(o.ov||0)<top.ov))rs.push('hợp phong cách '+s.st.filter(x=>w.styles.includes(x)).join(', ').toLowerCase());
 if(s.p===minP&&L.filter(x=>x.p===minP).length===1)rs.push('giá thấp nhất');
 if(s.r===maxR&&L.filter(x=>x.r===maxR).length===1)rs.push('điểm Google Maps cao nhất');
 if(!rs.length&&s.rv===maxRv)rs.push('nhiều đánh giá nhất');
 return {id:s.id,name:s.n,reasons:rs.slice(0,3).length?rs.slice(0,3):['cân bằng tốt giữa giá và đánh giá']};
}
function renderCompare(){

 const rec=recommendCompare(L),rid=rec.tie?0:rec.id;
 const rc=s=>s.id===rid?' class="rec"':'';
 const tag=`<span class="rectag" title="Dựa trên điểm Google Maps, giá và thông tin đám cưới của bạn">${svg(I.spark,13,2)}Đề xuất</span>`;

 const note=rec.tie?`<div class="recbox neutral">${svg(I.spark,20)}<div><b>Các lựa chọn khá ngang nhau</b><div class="sub">Chưa có phương án nổi bật hơn rõ rệt. Hãy xem khác biệt ở bảng bên dưới.</div></div></div>`

 app().innerHTML=`<div class="pagehead"><div><h1>So sánh dịch vụ${code('3.4')}</h1><p class="lede">${cat}, ${L.length} nhà cung cấp</p></div><button class="btn" onclick="go('favorites')">Quay lại yêu thích</button></div>
 ${note}
 <div class="card tbl-wrap"><table class="cmp"><thead><tr><th></th>${L.map(s=>`<th${rc(s)}><span class="cname2">${h(s.n)}${s.id===rid?tag:''}</span></th>`).join('')}</tr></thead><tbody>

 ${row('Khu vực',s=>s.loc)}
 ${row('Phong cách',s=>s.st.join(', '))}
 ${cat==='Nhà hàng'?row('Sức chứa tối đa',s=>s.cap+' khách'):''}
 ${row('Gói dịch vụ',s=>PK[s.cat].map((p,i)=>`<div>${p[0]}: ${tr(pkgPrice(s,i))}</div>`).join(''))}
 ${row('Điểm nổi bật',s=>s.hl.map(x=>`<div>${h(x)}</div>`).join(''))}
 ${row('',s=>`<div class="pa"><button class="btn ${s.id===rid||rec.tie?'primary ':''}sm" ${pl(s.id)?'disabled':''} onclick="addPlan(${s.id})">${pl(s.id)?'Trong kế hoạch':'Thêm vào kế hoạch'}</button><button class="btn sm" onclick="openDetail(${s.id})">Xem chi tiết</button></div>`)}
 </tbody></table></div>`;
}

 const sty=[...document.querySelectorAll('input[name=wfsty]:checked')].map(x=>x.value);
 const n=document.querySelectorAll('input[name=wfsvc]:checked').length;

function toggleAllWeddingServices(){

function saveWedding(edit){
 const e=$('#wf_err'),date=$('#wf_date').value,loc=$('#wf_loc').value,cap=parseInt($('#wf_cap').value,10)||0,bud=pm($('#wf_bud').value);
 if(!date){e.textContent='Vui lòng chọn ngày tổ chức.';return}
 if(pD(date)<=t0()){e.textContent='Ngày tổ chức phải sau hôm nay.';return}
 if(!loc){e.textContent='Vui lòng chọn địa điểm tổ chức.';return}
 if($('#wf_cap').value&&cap<1){e.textContent='Sức chứa phải lớn hơn 0.';return}
 if(bud<=0){e.textContent='Vui lòng nhập tổng ngân sách lớn hơn 0.';return}
 const type='Đám cưới';
 const styles=[...document.querySelectorAll('input[name=wfsty]:checked')].map(x=>x.value);
 const services=[...document.querySelectorAll('input[name=wfsvc]:checked')].map(x=>x.value);
 const first=!S.wedding;
 S.wedding={type,date,loc,cap,budget:bud,styles,services,start:first?iso(t0()):S.wedding.start};
 if(first){
  S.tasks=[{id:1,title:'Xác định ngân sách và quy mô tiệc',f:.05,done:true},{id:2,title:'Lập danh sách khách mời sơ bộ',f:.15,done:false},{id:3,title:'Thiết kế và gửi thiệp mời',f:.72,done:false},{id:4,title:'Xác nhận lần cuối với các nhà cung cấp',f:.94,done:false}];
  S.nextTid=5;
 }
 closeModal();render();
 toast(first?'Đã tạo timeline khung':'Đã lưu thay đổi');
 if(first){const cb=S._afterSetup;S._afterSetup=null;if(cb)cb();else if(S.page!=='timeline'){S.page='timeline';render();window.scrollTo(0,0)}}
}
function allRows(){
 const rows=[];
 S.tasks.forEach(t=>rows.push({key:'g:'+t.id,kind:'g',title:t.title,f:t.f,done:t.done,custom:t.custom}));
 slotCats().forEach(c=>{
  const dep=depCat(c),f=S.catDue[c]!==undefined?S.catDue[c]:CAT(c).dead;
  rows.push({key:'c:'+c,kind:'c',title:'Chốt '+c.toLowerCase(),f,done:!!dep,cat:c});
  if(dep){
   if(dep.date&&dep.date!==S.wedding.date)rows.push({key:'m:'+c,kind:'m',title:'Ngày thực hiện '+c.toLowerCase(),f:dd(wst(),pD(dep.date))/span(),done:false,cat:c});
   DT[c].forEach((x,i)=>{const k=dep.id+':'+i,r=S.dt[k];if(r)rows.push({key:'d:'+k,kind:'d',title:x[0],f:r.f,done:r.done,cat:c,svc:svc(dep.id).n})});
  }else rows.push({key:'l:'+c,kind:'lock',cat:c,f:.7,done:false});
 });
 return rows;
}
function renderTimeline(){
 if(!S.wedding){
  app().innerHTML=`<div class="intro"><h1>Thiết lập thông tin đám cưới${code('4.1')}</h1></div><div class="card pad narrow">${wedForm(false)}</div>`;
  return;
 }
 const w=S.wedding,days=Math.max(0,dd(t0(),wd())),all=allRows(),real=all.filter(r=>r.kind!=='lock'&&r.kind!=='m'),done=real.filter(r=>r.done).length;

 const blocks=`<div class="card rows" style="margin-top:20px">${list.map(rowHtml).join('')}${endRow}</div>`;
 app().innerHTML=`<div class="card tlhero"><div class="days">${days}<small>ngày nữa đến ${w.type.toLowerCase()}</small></div>
  <div class="facts"><div><b>${fD(wd())}</b></div><div class="muted">${h(w.loc)}, ${w.cap?w.cap+' khách':'chưa nhập sức chứa'}, ngân sách ${fm(w.budget)}</div>${w.styles.length?`<div class="muted">Phong cách: ${w.styles.join(', ')}</div>`:''}
   <div class="bar" aria-hidden="true"><i style="width:${real.length?Math.round(done/real.length*100):0}%"></i></div><div class="sub">Đã xong ${done}/${real.length} việc</div></div>
  <div class="tlactions"><button class="btn" onclick="openWedEdit()">Chỉnh sửa thông tin</button><button class="btn" onclick="addTask()">${svg(I.plus,15)}Thêm việc</button></div></div>
 <div class="pagehead" style="margin-bottom:0"><div><h1 style="font-size:26px">Timeline${code('4.2')}${code('4.4')}</h1></div>
  <div class="chips" role="group" aria-label="Lọc theo hạng mục"><button class="chip" aria-pressed="${!S.tlFilter}" onclick="S.tlFilter='';render()">Tất cả</button>${slots.map(c=>`<button class="chip" aria-pressed="${S.tlFilter===c}" onclick="S.tlFilter='${c}';render()">${c}</button>`).join('')}</div></div>
 ${blocks}`;
}
function rowHtml(r){
 if(r.kind==='m')return `<div class="row"><span class="rk" style="color:var(--accent)">${svg(I.flag,20)}</span><div class="rb"><div class="rt">${h(r.title)}</div><div class="sub">Ngày đã thống nhất với nhà cung cấp</div></div><div class="due">${fD(atF(r.f))}</div></div>`;
 if(r.kind==='lock')return `<div class="row lock"><span class="rk">${svg(I.lock,18)}</span><div class="rb"><div class="rt">Việc chi tiết của ${r.cat.toLowerCase()}</div><div class="sub">Mở sau khi bạn đặt cọc cho nhà cung cấp.</div></div></div>`;
 const due=atF(r.f),over=!r.done&&due<t0(),soon=!r.done&&!over&&dd(t0(),due)<=7;
 const mark=r.kind==='c'?`<span class="rk st ${r.done?'ok':''}" role="img" aria-label="${r.done?'Đã chốt':'Chưa chốt'}">${r.done?svg(I.check,13,3):''}</span>`
  :`<input class="chk" type="checkbox" ${r.done?'checked':''} onchange="toggleRow('${r.key}')" aria-label="${h(r.title)}">`;
 let extra='';
 if(r.kind==='d')extra=`<div class="sub">${h(r.svc)}</div>`;
 if(r.kind==='c'){
  const dep=depCat(r.cat),p=planCat(r.cat);
  if(dep)extra=`<div class="sub">Đã chốt ${h(svc(dep.id).n)}. Việc chi tiết nằm trong danh sách bên dưới.</div>`;
  else extra=`<div class="sub">${p?'Đang cân nhắc '+h(svc(p.id).n):'Chưa chọn nhà cung cấp'}</div>
   <div class="racts"><button class="btn ai sm" onclick="aiSuggest('${r.cat}')">${svg(I.spark,15)}Gợi ý bằng AI${code('4.3')}</button><button class="btn sm" onclick="findCat('${r.cat}')">Xem dịch vụ</button>${p?`<button class="btn sm" onclick="openChat(${p.id})">Nhắn tin</button>`:''}</div>`;
 }
 return `<div class="row ${r.done?'done':''}">${mark}<div class="rb"><div class="rt">${h(r.title)}</div>${extra}</div>
  <div class="rowend"><span class="due ${over?'over':soon?'soon':''}">${r.done?'Đã xong':(over?'Quá hạn ':'Hạn ')+(r.done?'':sD(due))}</span><button class="btn icon sm" aria-label="Sửa ${h(r.title)}" onclick="editRow('${r.key}')">${svg(I.pencil,14)}</button></div></div>`;
}
function toggleRow(key){
 const [k,a,b]=key.split(':');
 if(k==='g'){const t=S.tasks.find(x=>x.id==a);t.done=!t.done}
 if(k==='d'){const r=S.dt[a+':'+b];r.done=!r.done}
 render();
}
function getF(key){
 const p=key.split(':'),k=p[0];
 if(k==='g')return S.tasks.find(x=>x.id==p[1]).f;
 if(k==='c'){const c=key.slice(2);return S.catDue[c]!==undefined?S.catDue[c]:CAT(c).dead}
 return S.dt[p[1]+':'+p[2]].f;
}
function setF(key,f){
 const p=key.split(':'),k=p[0];
 if(k==='g')S.tasks.find(x=>x.id==p[1]).f=f;
 else if(k==='c')S.catDue[key.slice(2)]=f;
 else S.dt[p[1]+':'+p[2]].f=f;
}
function dateBounds(){return {min:iso(t0()),max:iso(addD(wd(),-1))}}
function editRow(key){
 const k=key[0],b=dateBounds(),cur=iso(atF(getF(key)));
 let title='',custom=false;
 if(k==='g'){const t=S.tasks.find(x=>x.id==key.slice(2));title=t.title;custom=!!t.custom}
 modal('Chỉnh sửa mốc thời gian',`<div class="form">
  ${k==='g'?`<div class="field"><label for="ed_t">Tên công việc</label><input id="ed_t" value="${h(title)}"></div>`:`<p><b>${h(rowTitle(key))}</b></p>`}
  <div class="field"><label for="ed_d">Hạn hoàn thành</label><input id="ed_d" type="date" min="${b.min}" max="${b.max}" value="${cur}"></div>
  <div class="err" id="ed_err" role="alert"></div></div>`,
  `${custom?`<button class="btn" style="margin-right:auto" onclick="delTask('${key}')">Xóa việc này</button>`:''}<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveRow('${key}')">Lưu</button>`);
}
function rowTitle(key){const r=allRows().find(x=>x.key===key);return r?r.title:''}
function saveRow(key){
 const d=$('#ed_d').value,e=$('#ed_err'),b=dateBounds();
 if(!d||d<b.min||d>b.max){e.textContent='Hạn phải từ hôm nay đến trước ngày tổ chức.';return}
 if(key[0]==='g'){const t=$('#ed_t').value.trim();if(!t){e.textContent='Tên công việc không được để trống.';return}S.tasks.find(x=>x.id==key.slice(2)).title=t}
 setF(key,dd(wst(),pD(d))/span());
 closeModal();toast('Đã cập nhật mốc thời gian');render();
}
function addTask(){
 const b=dateBounds();
 modal('Thêm việc vào timeline',`<div class="form"><div class="field"><label for="nt_t">Tên công việc</label><input id="nt_t" placeholder="Ví dụ: Đặt xe hoa"></div>
  <div class="field"><label for="nt_d">Hạn hoàn thành</label><input id="nt_d" type="date" min="${b.min}" max="${b.max}" value="${iso(atF(.5))}"></div><div class="err" id="nt_err" role="alert"></div></div>`,
  `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveTask()">Thêm việc</button>`);
}
function saveTask(){

 if(!t){e.textContent='Vui lòng nhập tên công việc.';return}
 if(!d||d<b.min||d>b.max){e.textContent='Hạn phải từ hôm nay đến trước ngày tổ chức.';return}
 S.tasks.push({id:S.nextTid++,title:t,f:dd(wst(),pD(d))/span(),done:false,custom:true});
 closeModal();toast('Đã thêm việc');render();
}
function delTask(key){S.tasks=S.tasks.filter(x=>x.id!=key.slice(2));closeModal();toast('Đã xóa việc');render()}

/* ---------- AI suggestion (4.3) ---------- */
function catBudget(c){
 if(S.alloc[c]>0)return {v:S.alloc[c],src:'đã phân bổ cho hạng mục'};
 return {v:Math.round(S.wedding.budget*CAT(c).share/1e5)*1e5,src:'ước tính theo tỷ lệ gợi ý'};
}
function aiPick(cat){
 const w=S.wedding,b=catBudget(cat),cap=w.cap;
 const base=SV.filter(s=>s.cat===cat);
 const ok=s=>s.p<=b.v&&(!(cat==='Nhà hàng'&&cap)||s.cap>=cap);
 const sm=s=>s.st.filter(x=>w.styles.includes(x)).length;
 const list=base.filter(s=>s.loc===w.loc&&ok(s)).sort((a,z)=>sm(z)-sm(a)||z.r-a.r||z.rv-a.rv).slice(0,3);
 const cheap=base.filter(s=>s.loc===w.loc).sort((a,z)=>a.p-z.p)[0]||base.slice().sort((a,z)=>a.p-z.p)[0];
 return {list,b,cheap};
}
function aiSuggest(cat){
 requireLogin(()=>{
  if(!S.wedding){toast('Hãy thiết lập thông tin đám cưới trước');go('timeline');return}
  S.cat=cat;S.q='';S.aiCat=cat;S.aiStage='loading';S.aiIds=[];
  S.page='services';render();window.scrollTo(0,0);
  setTimeout(()=>{
   if(S.aiCat!==cat)return;
   S.aiIds=aiPick(cat).list.map(s=>s.id);S.aiStage='done';
   if(S.page==='services')aiRefresh();
  },1100);
 });
}
function aiRefresh(){const s=$('#aislot');if(s)s.innerHTML=aiStrip();if($('#results'))filterServices()}
function aiStrip(){
 if(!S.aiCat||!S.wedding)return '';
 const cat=S.aiCat,w=S.wedding;
 const head=`<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><h2>${svg(I.spark,20)}Gợi ý bằng AI cho hạng mục ${cat.toLowerCase()}${code('4.3')}</h2><div class="pa"><button class="btn sm" onclick="go('timeline')">Quay lại timeline</button><button class="linkbtn" onclick="S.aiCat='';S.aiIds=[];aiRefresh()">Đóng gợi ý</button></div></div>`;
 if(S.aiStage==='loading')return `<div class="card aistrip">${head}<div style="display:flex;gap:12px;align-items:center;margin-top:14px"><div class="spin" style="margin:0"></div><span class="muted">Đang chọn nhà cung cấp hợp với ngân sách, địa điểm và phong cách của bạn</span></div></div>`;
 const r=aiPick(cat),b=r.b.v;
 const need=cat==='Nhà hàng'&&w.cap?', sức chứa '+w.cap+' khách':'';
 const sub=`Dựa trên ngân sách hạng mục ${tr(b)}, địa điểm ${w.loc}${w.styles.length?', phong cách '+w.styles.join(', ').toLowerCase():''}${need}.`;
 let body;
 if(r.list.length){
  body=`<div class="airow">${r.list.map(s=>{
   const hit=s.st.filter(x=>w.styles.includes(x));
   const why=[`Giá từ ${tr(s.p)}, nằm trong ngân sách hạng mục.`];
   if(hit.length)why.push(`Hợp phong cách ${hit.join(', ').toLowerCase()}.`);
   why.push(`Điểm ${s.r.toFixed(1)} trên Google Maps.`);
   if(s.cap&&w.cap)why.push(`Chứa tối đa ${s.cap} khách.`);
   return `<div class="air"><h4>${h(s.n)}</h4>${metaRow(s)}<div class="sub">${why.join(' ')}</div><div class="pa"><button class="btn sm" onclick="openDetail(${s.id})">Xem chi tiết</button><button class="btn primary sm" ${pl(s.id)?'disabled':''} onclick="addPlan(${s.id})">${pl(s.id)?'Trong kế hoạch':'Thêm vào kế hoạch'}</button></div></div>`;
  }).join('')}</div>`;
 }else{
  body=`<p style="margin-top:12px">Chưa có nhà cung cấp ${cat.toLowerCase()} tại ${w.loc} trong ngân sách ${tr(b)}${need?' và đủ chỗ':''}.${r.cheap?` Lựa chọn thấp nhất hiện có là ${h(r.cheap.n)} (${r.cheap.loc}), từ ${tr(r.cheap.p)}.`:''}</p><button class="btn sm" style="margin-top:10px" onclick="S.planTab='budget';go('plan')">Điều chỉnh ngân sách hạng mục</button>`;
 }
 return `<div class="card aistrip">${head}<p class="muted" style="margin-top:6px">${sub}</p>${body}<div class="hint">Prototype: kết quả được mô phỏng. Bản hoàn chỉnh gọi API mô hình ngôn ngữ và đối chiếu lại với danh sách nhà cung cấp trên WebPlan.</div></div>`;
}

 document.body.classList.add('chat-page');

   <div class="cfmenu" id="cfMenu" hidden><div class="cfh">Hạng mục dịch vụ</div>

  <div class="msgs" id="msgs">${msgsHtml()}</div>

   :'Cảm ơn bạn! Bên mình sẽ gửi thông tin chi tiết và xác nhận lại với bạn trong ít phút.';

  :`<div class="ord-f"><button class="btn sage" onclick="openPay(${id})">Xác nhận &amp; thanh toán cọc</button><button class="btn" onclick="reviseOrder(${id})">Yêu cầu chỉnh sửa</button></div>`;

  <div class="ord-r"><span>Gói dịch vụ</span><b>${h(o.pkg)}</b></div><div class="ord-r"><span>Ngày thực hiện</span><b>${fD(pD(o.date))}</b></div>

 if(e.status==='deposited')a=`<p class="sub">Đã đặt cọc ${fm(e.paid)}. Việc chi tiết của dịch vụ đã mở trong timeline.</p><button class="btn" onclick="S.tlFilter='${s.cat}';go('timeline')">Xem việc cần làm</button>`;
 else if(o&&o.state==='sent')a=`<p class="sub">Nhà cung cấp đã gửi đơn ${o.no}. Cần cọc <b>${fm(o.deposit)}</b> để giữ lịch.</p><button class="btn primary" onclick="openPay(${s.id})">Thanh toán cọc</button>`;
 else if(o&&o.state==='revising')a=`<p class="sub">Bạn đã yêu cầu chỉnh sửa. Nhà cung cấp sẽ gửi lại đơn trong khung chat.</p>`;
 else a=`<p class="sub">Hai bên trao đổi gói, ngày và giá ngay trong khung chat. Khi thống nhất, nhà cung cấp sẽ gửi đơn dịch vụ để bạn xác nhận và đặt cọc.</p>`;

 return a+sim;

/* --- phía NCC (mô phỏng) --- */
function vendorOrder(id){
 const e=pl(id),s=svc(id),o=e.order,w=S.wedding,pi=e.pkg===2?0:(e.pkg||0);
 const v=o||{pkg:PK[s.cat][pi][0],date:(w&&w.date)||'',price:pkgPrice(s,pi)};
 const dep=o?o.deposit:Math.round(v.price*.1/1e5)*1e5;
 modal('Tạo đơn dịch vụ'+code('7.3'),`<p class="muted" style="margin:-6px 0 14px">Giao diện phía nhà cung cấp, mô phỏng. Sau khi gửi, đơn hiện trong khung chat của khách hàng.</p>${o&&o.state==='revising'?`<div class="note ask" style="margin-bottom:14px;white-space:pre-wrap"><b>Khách hàng yêu cầu chỉnh sửa:</b>\n${h(o.note||'')}</div>`:''}<div class="form">

  <div class="field"><label for="o_dep">Tiền cọc yêu cầu (đồng)</label><input id="o_dep" inputmode="numeric" value="${fN(dep)}" oninput="fmtMoney(this)"><div class="hint">Mặc định 10% giá trị</div></div></div>

  `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="sendOrder(${id})">Gửi đơn cho khách hàng</button>`);

function vendorQuickOrder(id){

function commitOrder(id,pkg,date,price,dep){
 const e=pl(id),cv=ensureConvo(id),had=!!e.order;
 e.order={no:had?e.order.no:'#'+String(S.plan.filter(x=>x.order).length+1).padStart(3,'0'),pkg,date,price,deposit:dep,state:'sent'};
 e.price=price;e.date=date;e.status='quoted';
 if(!had)cv.push({from:'order',t:'Nhà cung cấp đã gửi đơn dịch vụ'});

function sendOrder(id){
 const e=pl(id),pkg=document.getElementById('o_pkg').value.trim(),date=document.getElementById('o_date').value,price=pm(document.getElementById('o_price').value),dep=pm(document.getElementById('o_dep').value),err=document.getElementById('o_err');

 commitOrder(id,pkg,date,price,dep);
}
/* --- phía khách hàng --- */
const REVQ=['Đổi ngày thực hiện','Đổi mức giá','Đổi gói dịch vụ','Đổi tiền cọc'];

 modal('Yêu cầu chỉnh sửa đơn',`<p class="muted" style="margin:-6px 0 14px">Cho nhà cung cấp biết bạn muốn chỉnh sửa gì. Nội dung này được gửi trong khung chat và hiện cho nhà cung cấp khi họ sửa đơn.</p><div class="form">

  <div class="pa" style="margin-top:8px;flex-wrap:wrap">${REVQ.map(q=>`<button type="button" class="btn sm" onclick="const t=document.getElementById('r_note');t.value+=(t.value?'\\n':'')+'${q}: ';t.focus()">${q}</button>`).join('')}</div></div>

function submitRevise(id){

 if(!note){document.getElementById('r_err').textContent='Vui lòng ghi rõ nội dung cần chỉnh sửa để nhà cung cấp biết.';return}

 e.order.state='revising';e.order.note=note;e.status='talk';
 cv.push({from:'me',t:`Yêu cầu chỉnh sửa đơn ${e.order.no}:\n${note}`});

 closeModal();toast('Đã gửi yêu cầu chỉnh sửa cho nhà cung cấp');render();
}

 });

function renderDeal(){
 const d=S.deal;
 if(!d||!pl(d.id)||!pl(d.id).order){S.page='plan';render();return}
 const e=pl(d.id),s=svc(d.id),c=CAT(s.cat),o=e.order,st=STATUS[e.status];
 const side=`<aside class="card pad" style="--cc:var(${c.c})"><span class="tag">${s.cat}</span><h3 style="font:600 20px var(--serif);margin:4px 0 12px">${h(s.n)}</h3>
  <div class="sumrow"><span class="muted">Đơn dịch vụ</span><b>${o.no}</b></div>
  <div class="sumrow"><span class="muted">Gói</span><b>${h(o.pkg)}</b></div>
  <div class="sumrow"><span class="muted">Ngày thực hiện</span><b>${fD(pD(o.date))}</b></div>
  <div class="sumrow"><span class="muted">Tổng giá trị</span><b>${fm(o.price)}</b></div>
  <div class="sumrow"><span class="muted">Cần cọc trước</span><b>${fm(o.deposit)}</b></div>
  <div style="margin-top:12px"><span class="badge${st[1]}">${st[0]}</span></div></aside>`;
 let main,title;
 if(!d.paid){
  title='Thanh toán cọc'+code('7.3');
  main=`<div class="card pad"><div class="form">
   <div class="note">Đơn dịch vụ do ${h(s.n)} gửi trong khung chat. Bạn kiểm tra lại thông tin bên phải trước khi thanh toán.</div>
   <div class="field"><span class="lbl">Phương thức thanh toán</span><div class="choice" style="flex-direction:column;gap:10px">
    <label><input type="radio" name="dpay" value="VNPay QR" checked> VNPay QR</label><label><input type="radio" name="dpay" value="Thẻ ATM nội địa"> Thẻ ATM nội địa qua VNPay</label><label><input type="radio" name="dpay" value="Thẻ quốc tế"> Thẻ quốc tế</label></div></div>
   <div class="hint">Sau khi thanh toán thành công, WebPlan ghi nhận cọc, đổi trạng thái dịch vụ thành đã chốt và tạo timeline chi tiết.</div>
   <div class="mact"><button class="btn" onclick="openChat(${s.id})">Quay lại tin nhắn</button><button class="btn primary" id="payBtn" onclick="dealPay()">Thanh toán ${fm(o.deposit)}</button></div></div></div>`;
 }else{
  title='Đặt cọc thành công'+code('7.3');
  main=`<div class="card pad"><p>Đã ghi nhận cọc <b>${fm(e.paid)}</b> cho <b>${h(s.n)}</b>.</p>
   <p class="muted" style="margin-top:8px">Timeline chi tiết của hạng mục ${s.cat.toLowerCase()} đã được tạo với ${DT[s.cat].length} việc cần làm.</p>
   <p class="muted" style="margin-top:8px">Phần còn lại <b>${fm(o.price-o.deposit)}</b> thanh toán trực tiếp cho nhà cung cấp theo thỏa thuận.</p>
   <div class="mact"><button class="btn" onclick="openChat(${s.id})">Về tin nhắn</button><button class="btn primary" onclick="S.tlFilter='${s.cat}';go('timeline')">Xem timeline chi tiết</button></div></div>`;
 }
 app().innerHTML=`<button class="btn back" onclick="openChat(${s.id})">Quay lại tin nhắn</button><div class="pagehead"><h1>${title}</h1></div><div class="dealgrid"><div>${main}</div>${side}</div>`;
}
function dealPay(){
 const m=document.querySelector('input[name=dpay]:checked'),b=document.getElementById('payBtn');
 b.disabled=true;b.textContent='Đang xử lý thanh toán';
 setTimeout(()=>{
  const d=S.deal,e=pl(d.id),s=svc(d.id),o=e.order;
  e.status='deposited';e.paid=o.deposit;e.pay=m?m.value:'VNPay QR';o.state='paid';
  DT[s.cat].forEach((x,i)=>{S.dt[d.id+':'+i]={done:false,f:fFor(x[1])}});
  ensureConvo(d.id).push({from:'sys',t:`Đã ghi nhận đặt cọc ${fm(o.deposit)}. Dịch vụ được chốt.`});
  d.paid=true;
  if(S.page==='deal')renderDeal();
  renderHeader();window.scrollTo(0,0);
 },1200);
}


render();
</script>
</body>
</html>
